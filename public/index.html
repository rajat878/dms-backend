  /* ============================= LAYOUTS ============================= */
  const TEMPLATE_LABELS = { split2:'Split (2 zones)', split3:'Split (3 zones)', grid4:'Grid (4 zones)', pip:'Picture-in-picture', ticker:'Main + ticker (bottom)', ticker_top:'Main + ticker (top)' };
  function zoneDiagram(template){
    const layouts = {
      split2:'grid-template-columns:1fr 1fr; grid-template-areas:"a b";',
      split3:'grid-template-columns:1.4fr 1fr; grid-template-rows:1fr 1fr; grid-template-areas:"a b" "a c";',
      grid4:'grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; grid-template-areas:"a b" "c d";',
      pip:'grid-template-columns:1fr; grid-template-rows:1fr;',
      ticker:'grid-template-columns:1fr; grid-template-rows:1fr auto; grid-template-areas:"a" "b";',
      ticker_top:'grid-template-columns:1fr; grid-template-rows:auto 1fr; grid-template-areas:"b" "a";',
    };
    if (template==='pip') return `<div class="zone-diagram" style="position:relative;"><i class="filled" style="width:100%;height:100%;"></i><i class="filled" style="position:absolute; right:2px; bottom:2px; width:35%; height:45%; background:var(--surface-2); border:1px solid var(--teal);"></i></div>`;
    const areas = ['a','b','c','d'];
    const count = { split2:2, split3:3, grid4:4, ticker:2, ticker_top:2 }[template] || 2;
    return `<div class="zone-diagram" style="${layouts[template]}">${areas.slice(0,count).map((a,i)=>`<i class="filled" style="grid-area:${a}; ${template.startsWith('ticker') && i===1 ? 'opacity:.5;':''}"></i>`).join('')}</div>`;
  }
  function renderLayouts(){
    return `
      <div class="view-head">
        <div><h1 style="font-size:20px;">Layouts</h1><div class="lede">Multi-zone screen templates. Each zone plays its own ordered playlist of content.</div></div>
        <div class="view-actions"><button class="btn btn-primary" id="newLayoutBtn">${icon('plus')} New layout</button></div>
      </div>
      <div class="media-grid" style="grid-template-columns:repeat(auto-fill,minmax(260px,1fr));">
        ${state.layouts.map(l=>`
          <div class="card">
            <div class="card-body">
              <div class="flex gap12" style="margin-bottom:12px;">
                ${zoneDiagram(l.template)}
                <div>
                  <div class="cell-primary" style="font-size:14px;">${esc(l.name)}</div>
                  <span class="badge b-violet" style="margin-top:4px;">${esc(TEMPLATE_LABELS[l.template]||l.template)}</span>
                </div>
              </div>
              <div class="text-faint" style="font-size:11.5px; margin-bottom:12px;">${l.item_count} item${l.item_count===1?'':'s'} across zones · created ${fmtDate(l.created_at).split(',')[0]}</div>
              <div class="flex gap8">
                <button class="btn btn-sm grow" data-edit-layout="${l.id}">Edit</button>
                <button class="btn btn-sm btn-primary grow" data-assign-layout="${l.id}">Assign</button>
                <button class="btn btn-sm btn-icon btn-danger" data-del-layout="${l.id}" title="Delete">${icon('trash',13)}</button>
              </div>
            </div>
          </div>`).join('') || `<div class="card"><div class="empty-state">${icon('layouts',30)}<div class="t">No layouts yet</div><div class="d">Build a split-screen, grid, or ticker layout from your content library.</div></div></div>`}
      </div>
    `;
  }
  function wireLayoutsEvents(){
    document.getElementById('newLayoutBtn')?.addEventListener('click', ()=>openLayoutModal(null));
    document.querySelectorAll('[data-edit-layout]').forEach(btn=>btn.addEventListener('click', async ()=>{
      try{ const res = await api('/api/layouts/'+btn.dataset.editLayout); openLayoutModal(res.layout); }
      catch(err){ toast(err.message, 'err'); }
    }));
    document.querySelectorAll('[data-del-layout]').forEach(btn=>btn.addEventListener('click', async ()=>{
      const ok = await confirmAction('Delete this layout? Devices assigned to it will show nothing until reassigned.');
      if (!ok) return;
      try{ await api('/api/layouts/'+btn.dataset.delLayout, { method:'DELETE' }); toast('Layout deleted', 'ok'); await loadAll(false); }
      catch(err){ toast(err.message, 'err'); }
    }));
    document.querySelectorAll('[data-assign-layout]').forEach(btn=>btn.addEventListener('click', ()=>openAssignLayoutModal(btn.dataset.assignLayout)));
  }

  function openLayoutModal(existing){
    const templates = Object.keys(state.layoutTemplates || TEMPLATE_ZONES_FALLBACK);
    const isEdit = !!existing;
    let template = existing ? existing.template : templates[0];
    let zoneItems = {}; // zoneKey -> [{id,name,media_type}]
    if (existing) Object.keys(existing.zones||{}).forEach(k=>{ zoneItems[k] = (existing.zones[k]||[]).slice(); });

    openModal(`
      <div class="modal-head"><h3>${isEdit?'Edit layout':'New layout'}</h3><button class="btn btn-icon btn-ghost" data-close-modal>${icon('x',15)}</button></div>
      <div class="modal-body">
        <div class="form-row cols-2" style="margin-bottom:14px;">
          <div class="field" style="margin-bottom:0;"><label>Layout name</label><input id="layoutName" value="${esc(existing?.name||'')}" placeholder="e.g. Reception Split"></div>
          <div class="field" style="margin-bottom:0;"><label>Template</label>
            <select id="layoutTemplate" ${isEdit?'disabled':''}>${templates.map(t=>`<option value="${t}" ${t===template?'selected':''}>${esc(TEMPLATE_LABELS[t]||t)}</option>`).join('')}</select>
          </div>
        </div>
        <div id="zoneBuilder"></div>
      </div>
      <div class="modal-foot"><button class="btn" data-close-modal>Cancel</button><button class="btn btn-primary" id="saveLayoutBtn">${icon('check',14)} ${isEdit?'Save changes':'Create layout'}</button></div>
    `, {wide:true});
    wireModalClose();

    function paintZones(){
      const zones = (state.layoutTemplates && state.layoutTemplates[template]) || TEMPLATE_ZONES_FALLBACK[template] || [];
      document.getElementById('zoneBuilder').innerHTML = zones.map(z=>`
        <fieldset>
          <legend>${esc(z.replace(/_/g,' '))}</legend>
          <div class="inline-form" style="margin-bottom:8px;">
            <select data-zone-add="${z}">
              <option value="">Add content to this zone…</option>
              ${state.ads.map(a=>`<option value="${a.id}">${esc(a.name)} (${a.media_type})</option>`).join('')}
            </select>
            <button class="btn btn-sm" data-zone-add-btn="${z}">${icon('plus',13)}</button>
          </div>
          <div class="timeline" id="zoneList-${z}" style="gap:0;"></div>
        </fieldset>
      `).join('');
      zones.forEach(z=>{ if (!zoneItems[z]) zoneItems[z] = []; paintZoneList(z); });
      document.querySelectorAll('[data-zone-add-btn]').forEach(btn=>btn.addEventListener('click', ()=>{
        const z = btn.dataset.zoneAddBtn;
        const sel = document.querySelector(`[data-zone-add="${z}"]`);
        const adId = sel.value; if (!adId) return;
        const ad = state.ads.find(a=>String(a.id)===adId);
        zoneItems[z].push({ id: ad.id, name: ad.name, media_type: ad.media_type });
        sel.value = ''; paintZoneList(z);
      }));
    }
    function paintZoneList(z){
      const wrap = document.getElementById('zoneList-'+z);
      const items = zoneItems[z] || [];
      wrap.innerHTML = items.length ? items.map((it,i)=>{
        const m = MEDIA_META[it.media_type] || MEDIA_META.text;
        return `<div class="timeline-item" style="padding:7px 0;">
          <span style="color:var(--text-faint)">${icon(m.icon,14)}</span>
          <div class="timeline-body"><div class="timeline-title" style="font-size:12px;">${i+1}. ${esc(it.name)}</div></div>
          <div class="flex gap8">
            <button class="btn btn-icon btn-ghost" style="width:24px;height:24px;" data-zone-up="${z}:${i}" ${i===0?'disabled':''}>${icon('chevDown',12)}</button>
            <button class="btn btn-icon btn-ghost" style="width:24px;height:24px;" data-zone-rm="${z}:${i}">${icon('x',12)}</button>
          </div>
        </div>`;
      }).join('') : `<div class="text-faint" style="font-size:11.5px; padding:6px 0;">No content yet — add at least one item.</div>`;
      wrap.querySelectorAll('[data-zone-rm]').forEach(b=>b.addEventListener('click', ()=>{
        const [zz,i] = b.dataset.zoneRm.split(':'); zoneItems[zz].splice(Number(i),1); paintZoneList(zz);
      }));
      wrap.querySelectorAll('[data-zone-up]').forEach(b=>b.addEventListener('click', ()=>{
        const [zz,i] = b.dataset.zoneUp.split(':'); const idx = Number(i);
        [zoneItems[zz][idx-1], zoneItems[zz][idx]] = [zoneItems[zz][idx], zoneItems[zz][idx-1]]; paintZoneList(zz);
      }));
    }
    document.getElementById('layoutTemplate').addEventListener('change', (e)=>{ template = e.target.value; zoneItems = {}; paintZones(); });
    paintZones();

    document.getElementById('saveLayoutBtn').addEventListener('click', async ()=>{
      const name = document.getElementById('layoutName').value.trim();
      if (!name){ toast('Layout name is required', 'err'); return; }
      const zones = {};
      Object.keys(zoneItems).forEach(z => zones[z] = zoneItems[z].map(it=>it.id));
      const empty = Object.entries(zones).filter(([,v])=>v.length===0);
      if (empty.length){ toast(`Add content to: ${empty.map(([k])=>k).join(', ')}`, 'err'); return; }
      try{
        if (isEdit) await api('/api/layouts/'+existing.id, { method:'PUT', json:{ name, zones } });
        else await api('/api/layouts', { method:'POST', json:{ name, template, zones } });
        toast(isEdit?'Layout updated':'Layout created', 'ok'); closeModal(); await loadAll(false);
      }catch(err){ toast(err.message, 'err'); }
    });
  }

    });

                  </div>
                </td>
              </tr>`).join('') || `<tr><td colspan="4"><div class="empty-state">${icon('apps',30)}<div class="t">No APKs uploaded</div><div class="d">Upload an APK to push app installs to your fleet remotely.</div></div></td></tr>`}
            </tbody>
          </table>
        </div>
      </div>
    `;
  }
  function wireAppsEvents(){
    document.getElementById('newApkBtn')?.addEventListener('click', openUploadApkModal);
    document.querySelectorAll('[data-copy-url]').forEach(btn=>btn.addEventListener('click', async ()=>{
      try{ await navigator.clipboard.writeText(btn.dataset.copyUrl); toast('Download URL copied', 'ok'); }
      catch{ toast(btn.dataset.copyUrl, 'info'); }
    }));
    document.querySelectorAll('[data-install-apk]').forEach(btn=>btn.addEventListener('click', ()=>openInstallApkModal(btn.dataset.installApk)));
  }
  function openUploadApkModal(){
    openModal(`
      <div class="modal-head"><h3>Upload APK</h3><button class="btn btn-icon btn-ghost" data-close-modal>${icon('x',15)}</button></div>
      <div class="modal-body">
        <div class="dropzone" id="apkDropzone">${icon('upload',22)}<div style="margin-top:8px;">Click to choose an .apk file or drag it here</div><input type="file" id="apkFile" accept=".apk" style="display:none">
        <div id="apkFileName" class="text-dim" style="margin-top:8px; font-size:12px;"></div></div>
      </div>
      <div class="modal-foot"><button class="btn" data-close-modal>Cancel</button><button class="btn btn-primary" id="apkSaveBtn">${icon('upload',14)} Upload</button></div>
    `);
    wireModalClose();
    const dz = document.getElementById('apkDropzone'), input = document.getElementById('apkFile');
    dz.addEventListener('click', ()=>input.click());
    input.addEventListener('change', ()=>{ document.getElementById('apkFileName').textContent = input.files[0] ? input.files[0].name+' · '+fmtBytes(input.files[0].size) : ''; });
    ['dragover','dragleave','drop'].forEach(evt=>dz.addEventListener(evt, e=>{ e.preventDefault(); dz.classList.toggle('drag', evt==='dragover'); }));
    dz.addEventListener('drop', e=>{ input.files = e.dataTransfer.files; document.getElementById('apkFileName').textContent = input.files[0]?.name || ''; });
    document.getElementById('apkSaveBtn').addEventListener('click', async ()=>{
      const file = input.files[0];
      if (!file){ toast('Choose an .apk file first', 'err'); return; }
      const form = new FormData(); form.append('apk', file);
      try{ await api('/api/apks', { method:'POST', body:form }); toast('APK uploaded', 'ok'); closeModal(); await loadAll(false); }
      catch(err){ toast(err.message, 'err'); }
    });
  }
  function openInstallApkModal(apkId){
    const apk = state.apks.find(a=>String(a.id)===String(apkId));
    openModal(`
      <div class="modal-head"><h3>Install "${esc(apk.filename)}"</h3><button class="btn btn-icon btn-ghost" data-close-modal>${icon('x',15)}</button></div>
      <div class="modal-body">
        <div class="radio-tabs" style="margin-bottom:14px;" id="installTargetTabs"><button class="active" data-target="device">Single device</button><button data-target="group">Whole group</button></div>
        <div class="field" id="installTargetField"><label>Device</label>
          <select id="installTarget">${state.devices.map(d=>`<option value="${esc(d.device_id)}">${esc(deviceLabel(d))}</option>`).join('')}</select>
        </div>
        <p class="text-faint" style="font-size:11.5px; line-height:1.5;">Android will prompt on-device to confirm the install unless the agent has Device Owner privileges.</p>
      </div>
      <div class="modal-foot"><button class="btn" data-close-modal>Cancel</button><button class="btn btn-primary" id="installSendBtn">${icon('send',14)} Install</button></div>
    `);
    wireModalClose();
    let targetType = 'device';
    document.querySelectorAll('#installTargetTabs [data-target]').forEach(t=>t.addEventListener('click', ()=>{
      document.querySelectorAll('#installTargetTabs [data-target]').forEach(x=>x.classList.remove('active')); t.classList.add('active');
      targetType = t.dataset.target;
      document.getElementById('installTargetField').innerHTML = targetType==='device'
        ? `<label>Device</label><select id="installTarget">${state.devices.map(d=>`<option value="${esc(d.device_id)}">${esc(deviceLabel(d))}</option>`).join('')}</select>`
        : `<label>Group</label><select id="installTarget">${state.groups.map(g=>`<option value="${g.id}">${esc(g.name)} (${g.device_count})</option>`).join('')}</select>`;
    }));
    document.getElementById('installSendBtn').addEventListener('click', async ()=>{
      const val = document.getElementById('installTarget').value;
      if (!val){ toast('Choose a target', 'err'); return; }
      try{
        if (targetType==='device'){
          await api(`/api/devices/${encodeURIComponent(val)}/commands`, { method:'POST', json:{ command_type:'INSTALL_APP', payload:{ apk_url: apk.url } } });
          toast('Install command sent', 'ok');
        } else {
          const ids = state.devices.filter(d=>String(d.group_id)===val).map(d=>d.device_id);
          if (!ids.length){ toast('That group has no devices', 'err'); return; }
          const res = await api('/api/devices/bulk-commands', { method:'POST', json:{ device_ids:ids, command_type:'INSTALL_APP', payload:{ apk_url: apk.url } } });
          toast(`Install command sent to ${res.sent_to} device(s)`, 'ok');
        }
        closeModal();
      }catch(err){ toast(err.message, 'err'); }
    });
  }

  /* ============================= ALERTS ============================= */
  function renderAlerts(){
    return `
      <div class="view-head">
        <div><h1 style="font-size:20px;">Alerts</h1><div class="lede">Devices offline, low on battery, or low on storage right now.</div></div>
      </div>
      <div class="card">
        <div class="card-body">
          ${state.alerts.length === 0 ? `<div class="empty-state">${icon('check',32)}<div class="t">All clear</div><div class="d">Every device is online with healthy battery and storage.</div></div>` :
          `<div class="timeline">${state.alerts.map(a=>`
            <div class="timeline-item">
              <span class="timeline-dot" style="background:${a.alerts.some(x=>x.type==='offline')?'var(--red)':'var(--amber)'}"></span>
              <div class="timeline-body">
                <div class="timeline-title">${esc(a.name||a.device_id)} <span class="mono text-faint" style="font-weight:400;">${esc(a.device_id)}</span></div>
                <div class="flex gap8" style="margin-top:5px; flex-wrap:wrap;">
                  ${a.alerts.map(x=>`<span class="badge ${x.type==='offline'?'b-red':x.type==='low_battery'?'b-amber':'b-blue'}">${esc(x.message)}</span>`).join('')}
                </div>
              </div>
              <button class="btn btn-sm" data-open-device="${esc(a.device_id)}">Manage</button>
            </div>`).join('')}</div>`}
        </div>
      </div>
    `;
  }
  function wireAlertsEvents(){}

  /* ============================= DEVICE DRAWER ============================= */
  let drawerDeviceId = null;
  let drawerData = null;
  let drawerTab = 'overview';

  async function openDeviceDrawer(deviceId){
    drawerDeviceId = deviceId; drawerTab = 'overview';
    document.getElementById('drawerTitle').textContent = 'Loading…';
    document.getElementById('drawerSub').textContent = deviceId;
    document.getElementById('drawerBody').innerHTML = `<div class="skel" style="height:180px;"></div>`;
    openDrawer();
    try{
      drawerData = await api(`/api/devices/${encodeURIComponent(deviceId)}`);
      paintDrawer();
    }catch(err){
      document.getElementById('drawerBody').innerHTML = `<div class="empty-state">${icon('danger',26)}<div class="t">Couldn't load device</div><div class="d">${esc(err.message)}</div></div>`;
    }
  }
  function paintDrawer(){
    const d = drawerData.device;
    const s = deviceStatus(d);
    document.getElementById('drawerTitle').textContent = deviceLabel(d);
    document.getElementById('drawerSub').innerHTML = `<span class="mono">${esc(d.device_id)}</span>`;
    document.getElementById('drawerTabs').innerHTML = ['overview','control','history'].map(t=>
      `<div class="drawer-tab ${drawerTab===t?'active':''}" data-drawer-tab="${t}">${t==='overview'?'Overview':t==='control'?'Remote Control':'History'}</div>`
    ).join('');
    document.querySelectorAll('[data-drawer-tab]').forEach(el=>el.addEventListener('click', ()=>{ drawerTab = el.dataset.drawerTab; paintDrawer(); }));
    const body = document.getElementById('drawerBody');
    if (drawerTab === 'overview') body.innerHTML = drawerOverviewHtml(d, s);
    else if (drawerTab === 'control') body.innerHTML = drawerControlHtml(d);
    else body.innerHTML = drawerHistoryHtml();
    wireDrawerEvents(d);
  }

  function drawerOverviewHtml(d, s){
    const battColor = d.battery==null?'var(--surface-3)':d.battery<20?'var(--red)':d.battery<40?'var(--amber)':'var(--green)';
    return `
      <div class="flex gap8" style="margin-bottom:16px;">
        <span class="badge ${statusMeta(s).badge}" style="font-size:12px; padding:5px 10px;">${signalIcon(s)} ${statusMeta(s).label}</span>
        <span class="text-faint mono" style="font-size:11.5px;">last seen ${fmtRelTime(d.last_seen)}</span>
      </div>
      <div class="stat-grid" style="grid-template-columns:1fr 1fr;">
        <div class="stat-card"><div class="stat-label">${icon('battery',12)} Battery</div><div class="stat-value" style="font-size:20px;">${d.battery!=null?d.battery+'%':'—'}</div><div class="meter" style="width:100%; margin-top:8px;"><i style="width:${d.battery??0}%; background:${battColor}"></i></div></div>
        <div class="stat-card"><div class="stat-label">${icon('plug',12)} Power</div><div class="stat-value" style="font-size:20px;">${d.power_connected==null?'—':d.power_connected?'Plugged in':'On battery'}</div></div>
        <div class="stat-card"><div class="stat-label">${icon('devices',12)} Storage free</div><div class="stat-value" style="font-size:20px;">${fmtBytes(d.storage_free)}</div></div>
        <div class="stat-card"><div class="stat-label">${icon('volume',12)} Volume</div><div class="stat-value" style="font-size:20px;">${d.volume_percent!=null?d.volume_percent+'%':'—'} ${d.muted?'<span class="badge b-gray" style="font-size:9.5px;">muted</span>':''}</div></div>
      </div>
      <hr class="divider">
      <div class="field"><label>Group</label>
        <select id="drawerGroupSelect">
          <option value="">Uncategorized</option>
          ${state.groups.map(g=>`<option value="${g.id}" ${String(d.group_id)===String(g.id)?'selected':''}>${esc(g.name)}</option>`).join('')}
        </select>
      </div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; font-size:12.5px; margin-top:16px;">
        <div><div class="text-faint">Agent version</div><div class="mono" style="margin-top:2px;">${esc(d.app_version||'—')}</div></div>
        <div><div class="text-faint">Brightness</div><div class="mono" style="margin-top:2px;">${d.brightness_percent!=null?d.brightness_percent+'%':'—'}</div></div>
        <div><div class="text-faint">Registered</div><div class="mono" style="margin-top:2px;">${fmtDate(d.created_at)}</div></div>
        <div><div class="text-faint">FCM push</div><div class="mono" style="margin-top:2px;">${d.fcm_token?'Registered':'Not registered'}</div></div>
      </div>
    `;
  }

  const CONTROL_ACTIONS = [
    { type:'REFRESH_CONTENT', label:'Refresh content', desc:'Re-fetch and re-apply the assigned layout now', icon:'refresh' },
    { type:'CLEAR_AD', label:'Clear pushed ad', desc:'Remove any full-screen ad overlay', icon:'clear' },
    { type:'LOCK_DEVICE', label:'Lock screen', desc:'Lock now (needs Device Admin active)', icon:'lock' },
    { type:'RELEASE_LOCK', label:'Release lock', desc:'Undo a Force Lock', icon:'unlock' },
    { type:'FORCE_LOCK', label:'Force lock', desc:'Keep re-locking until released', icon:'lock', danger:true },
    { type:'REBOOT', label:'Reboot device', desc:'Requires Device Owner mode', icon:'power', danger:true },
  ];
  function drawerControlHtml(d){
    return `
      <div class="action-grid" style="margin-bottom:18px;">
        ${CONTROL_ACTIONS.map(a=>`
          <div class="action-btn ${a.danger?'danger':''}" data-quick-cmd="${a.type}">
            ${icon(a.icon,16)}<span class="label">${a.label}</span><span class="desc">${a.desc}</span>
          </div>`).join('')}
      </div>

      <fieldset>
        <legend>Show message</legend>
        <div class="inline-form"><input id="ctlMessage" placeholder="Message text"><button class="btn btn-sm btn-primary" data-send-message>${icon('send',12)}</button></div>
      </fieldset>

      <fieldset>
        <legend>Volume — ${d.volume_percent??'—'}%</legend>
        <div class="range-row"><input type="range" id="ctlVolume" min="0" max="100" value="${d.volume_percent??50}"><span class="val" id="ctlVolumeVal">${d.volume_percent??50}</span><button class="btn btn-sm" data-send-volume>Set</button></div>
        <div class="flex gap8" style="margin-top:10px;"><span class="text-dim" style="font-size:12px;">Muted</span><label class="toggle"><input type="checkbox" id="ctlMute" ${d.muted?'checked':''}><span class="track"></span></label></div>
      </fieldset>

      <fieldset>
        <legend>Brightness — ${d.brightness_percent??'—'}%</legend>
        <div class="range-row"><input type="range" id="ctlBrightness" min="0" max="100" value="${d.brightness_percent??70}"><span class="val" id="ctlBrightnessVal">${d.brightness_percent??70}</span><button class="btn btn-sm" data-send-brightness>Set</button></div>
      </fieldset>

      <fieldset>
        <legend>Open app</legend>
        <div class="inline-form"><input id="ctlPackage" placeholder="com.example.app" class="mono"><button class="btn btn-sm btn-primary" data-send-openapp>${icon('send',12)}</button></div>
      </fieldset>

      <fieldset>
        <legend>Push ad instantly</legend>
        <div class="inline-form">
          <select id="ctlAdPick"><option value="">Choose content…</option>${state.ads.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select>
          <button class="btn btn-sm btn-primary" data-send-pushad>${icon('send',12)}</button>
        </div>
      </fieldset>

      <fieldset>
        <legend>Install APK</legend>
        <div class="inline-form">
          <select id="ctlApkPick"><option value="">Choose an uploaded APK…</option>${state.apks.map(a=>`<option value="${a.id}">${esc(a.filename)}</option>`).join('')}</select>
          <button class="btn btn-sm btn-primary" data-send-install>${icon('send',12)}</button>
        </div>
      </fieldset>

      <fieldset style="margin-bottom:0;">
        <legend>Heartbeat interval</legend>
        <div class="inline-form"><input id="ctlInterval" type="number" min="15" placeholder="Minutes (min 15)"><button class="btn btn-sm btn-primary" data-send-interval>${icon('send',12)}</button></div>
      </fieldset>
    `;
  }

  function drawerHistoryHtml(){
    const hist = (drawerData.history || []).slice().reverse();
    const commands = drawerData.commands || [];
    const spark = hist.length > 1 ? sparklineSvg(hist.map(h=>h.battery)) : '';
    return `
      <div style="margin-bottom:18px;">
        <div class="flex" style="justify-content:space-between; margin-bottom:6px;"><span class="text-dim" style="font-size:12px; font-weight:600;">Battery, last ${hist.length} heartbeats</span></div>
        ${hist.length > 1 ? spark : `<div class="text-faint" style="font-size:12px;">Not enough heartbeat history yet.</div>`}
      </div>
      <hr class="divider">
      <div class="text-dim" style="font-size:12px; font-weight:600; margin-bottom:8px;">Command log</div>
      ${commands.length === 0 ? `<div class="text-faint" style="font-size:12.5px;">No commands sent yet.</div>` :
        `<div class="timeline">${commands.map(c=>{
          const badge = c.status==='done'?'b-green':c.status==='failed'?'b-red':c.status==='delivered'?'b-blue':'b-gray';
          return `<div class="timeline-item">
            <span class="timeline-dot" style="background:${c.status==='done'?'var(--green)':c.status==='failed'?'var(--red)':'var(--text-faint)'}"></span>
            <div class="timeline-body">
              <div class="timeline-title mono">${esc(c.command_type)} <span class="badge ${badge}" style="margin-left:4px;">${c.status}</span></div>
              <div class="timeline-meta">${fmtDate(c.created_at)}${c.result?' · '+esc(c.result):''}</div>
            </div>
          </div>`;
        }).join('')}</div>`}
    `;
  }
  function sparklineSvg(values){
    const w = 420, h = 64, pad = 4;
    const max = 100, min = 0;
    const pts = values.map((v,i)=>{
      const x = pad + (i/(values.length-1)) * (w-2*pad);
      const y = h - pad - ((v-min)/(max-min)) * (h-2*pad);
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(' ');
    return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
      <polyline points="${pts}" fill="none" stroke="var(--teal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>`;
  }

  async function sendDeviceCommand(deviceId, command_type, payload, successMsg){
    try{
      await api(`/api/devices/${encodeURIComponent(deviceId)}/commands`, { method:'POST', json:{ command_type, payload: payload ?? null } });
      toast(successMsg || `${command_type.replace(/_/g,' ').toLowerCase()} sent`, 'ok');
      if (drawerDeviceId === deviceId && drawerTab === 'history'){
        drawerData = await api(`/api/devices/${encodeURIComponent(deviceId)}`); paintDrawer();
      }
    }catch(err){ toast(err.message, 'err'); }
  }

  function wireDrawerEvents(d){
    document.querySelectorAll('[data-quick-cmd]').forEach(btn=>btn.addEventListener('click', async ()=>{
      const type = btn.dataset.quickCmd;
      if (['REBOOT','FORCE_LOCK'].includes(type)){
        const ok = await confirmAction(`Send "${type.replace(/_/g,' ')}" to ${deviceLabel(d)}?`, {confirmLabel:'Send'});
        if (!ok) return;
      }
      sendDeviceCommand(d.device_id, type);
    }));
    document.querySelector('[data-send-message]')?.addEventListener('click', ()=>{
      const text = document.getElementById('ctlMessage').value.trim();
      if (!text){ toast('Enter a message', 'err'); return; }
      sendDeviceCommand(d.device_id, 'SHOW_MESSAGE', { text }, 'Message sent');
    });
    const vol = document.getElementById('ctlVolume');
    vol?.addEventListener('input', ()=>document.getElementById('ctlVolumeVal').textContent = vol.value);
    document.querySelector('[data-send-volume]')?.addEventListener('click', ()=>sendDeviceCommand(d.device_id, 'SET_VOLUME', { level:Number(vol.value) }, 'Volume set'));
    document.getElementById('ctlMute')?.addEventListener('change', (e)=>sendDeviceCommand(d.device_id, 'SET_MUTE', { muted:e.target.checked }, e.target.checked?'Muted':'Unmuted'));
    const bri = document.getElementById('ctlBrightness');
    bri?.addEventListener('input', ()=>document.getElementById('ctlBrightnessVal').textContent = bri.value);
    document.querySelector('[data-send-brightness]')?.addEventListener('click', ()=>sendDeviceCommand(d.device_id, 'SET_BRIGHTNESS', { level:Number(bri.value) }, 'Brightness set'));
    document.querySelector('[data-send-openapp]')?.addEventListener('click', ()=>{
      const pkg = document.getElementById('ctlPackage').value.trim();
      if (!pkg){ toast('Enter a package name', 'err'); return; }
      sendDeviceCommand(d.device_id, 'OPEN_APP', { package_name:pkg }, 'Open app command sent');
    });
    document.querySelector('[data-send-pushad]')?.addEventListener('click', ()=>{
      const id = document.getElementById('ctlAdPick').value;
      if (!id){ toast('Choose content first', 'err'); return; }
      const ad = state.ads.find(a=>String(a.id)===id);
      sendDeviceCommand(d.device_id, 'PUSH_AD', { media_type:ad.media_type, url:ad.url }, 'Ad pushed');
    });
    document.querySelector('[data-send-install]')?.addEventListener('click', ()=>{
      const id = document.getElementById('ctlApkPick').value;
      if (!id){ toast('Choose an APK first', 'err'); return; }
      const apk = state.apks.find(a=>String(a.id)===id);
      sendDeviceCommand(d.device_id, 'INSTALL_APP', { apk_url:apk.url }, 'Install command sent');
    });
    document.querySelector('[data-send-interval]')?.addEventListener('click', ()=>{
      const min = Number(document.getElementById('ctlInterval').value);
      if (!min || min < 15){ toast('Enter 15 or more minutes', 'err'); return; }
      sendDeviceCommand(d.device_id, 'SET_REPORT_INTERVAL', { minutes:min }, 'Report interval updated');
    });
    document.getElementById('drawerGroupSelect')?.addEventListener('change', async (e)=>{
      try{
        await api(`/api/devices/${encodeURIComponent(d.device_id)}`, { method:'PATCH', json:{ group_id: e.target.value ? Number(e.target.value) : null } });
        toast('Group updated', 'ok'); await loadAll(false);
      }catch(err){ toast(err.message, 'err'); }
    });
  }

</script>

</body>
</html>
