<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DELTA VIEW — DMS Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* ============================= DESIGN TOKENS ============================= */
    :root{
      --bg:#0a0e13;
      --surface:#10161f;
      --surface-2:#161d29;
      --surface-3:#1c2531;
      --border:#212a37;
      --border-strong:#303c4d;
      --text:#eef2f7;
      --text-dim:#8d99ac;
      --text-faint:#576273;

      --teal:#2dd4c8;
      --teal-dim:#0e2b2a;
      --teal-strong:#19a89d;

      --amber:#f2a53d;
      --amber-dim:#2c2110;

      --red:#f0563f;
      --red-dim:#2d1512;

      --green:#38d089;
      --green-dim:#0f2a1e;

      --violet:#9b8cfb;
      --violet-dim:#201c38;

      --blue:#5eb1f0;
      --blue-dim:#132638;

      --font-display:'Space Grotesk', 'Inter', system-ui, sans-serif;
      --font-body:'Inter', system-ui, -apple-system, sans-serif;
      --font-mono:'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;

      --radius-sm:6px;
      --radius:10px;
      --radius-lg:14px;
      --shadow-card:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
      --shadow-pop:0 12px 40px -8px rgba(0,0,0,.65), 0 2px 8px rgba(0,0,0,.4);
      --sidebar-w:236px;
    }

    *,*::before,*::after{box-sizing:border-box;}
    html,body{height:100%;}
    body{
      margin:0;
      background:
        radial-gradient(1200px 600px at 100% -10%, rgba(45,212,200,.05), transparent 60%),
        var(--bg);
      color:var(--text);
      font-family:var(--font-body);
      -webkit-font-smoothing:antialiased;
      font-size:14px;
    }
    ::selection{background:var(--teal-dim); color:var(--teal);}
    ::-webkit-scrollbar{width:10px; height:10px;}
    ::-webkit-scrollbar-track{background:transparent;}
    ::-webkit-scrollbar-thumb{background:var(--surface-3); border-radius:8px; border:2px solid var(--bg);}
    ::-webkit-scrollbar-thumb:hover{background:var(--border-strong);}
    a{color:inherit;}
    button{font-family:inherit;}
    :focus-visible{outline:2px solid var(--teal); outline-offset:2px; border-radius:4px;}
    @media (prefers-reduced-motion: reduce){
      *{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important;}
    }

    h1,h2,h3,h4{font-family:var(--font-display); margin:0; letter-spacing:-.01em;}
    .mono{font-family:var(--font-mono);}
    .hidden{display:none !important;}

    /* ============================= SCROLLABLE UTIL ============================= */
    .text-dim{color:var(--text-dim);}
    .text-faint{color:var(--text-faint);}

    /* ============================= LOGIN / CONNECT GATE ============================= */
    #loginScreen{
      min-height:100vh; display:flex; align-items:center; justify-content:center;
      padding:24px;
      background:
        radial-gradient(900px 500px at 50% 0%, rgba(45,212,200,.07), transparent 65%),
        var(--bg);
    }
    .login-card{
      width:100%; max-width:400px;
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:var(--radius-lg);
      padding:32px;
      box-shadow:var(--shadow-pop);
    }
    .login-mark{display:flex; align-items:center; gap:10px; margin-bottom:22px;}
    .login-mark svg{color:var(--teal);}
    .login-mark .wordmark{font-family:var(--font-display); font-weight:700; font-size:17px; letter-spacing:-.01em;}
    .login-mark .wordmark span{color:var(--text-dim); font-weight:500;}
    .login-card h1{font-size:19px; margin-bottom:6px;}
    .login-card p{color:var(--text-dim); font-size:13px; line-height:1.55; margin:0 0 22px;}
    .field{margin-bottom:14px;}
    .field label{display:block; font-size:12px; font-weight:600; color:var(--text-dim); margin-bottom:6px; text-transform:uppercase; letter-spacing:.03em;}
    .field input, .field select, .field textarea{
      width:100%; background:var(--surface-3); border:1px solid var(--border-strong);
      color:var(--text); border-radius:var(--radius-sm); padding:10px 12px; font-size:13.5px;
      font-family:inherit;
    }
    .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--teal);}
    .field .hint{font-size:11.5px; color:var(--text-faint); margin-top:6px; line-height:1.5;}
    .login-error{
      display:none; background:var(--red-dim); border:1px solid rgba(240,86,63,.35); color:#ffb3a6;
      font-size:12.5px; padding:9px 11px; border-radius:var(--radius-sm); margin-bottom:14px; line-height:1.5;
    }

    /* ============================= BUTTONS ============================= */
    .btn{
      display:inline-flex; align-items:center; justify-content:center; gap:7px;
      font-size:13px; font-weight:600; border-radius:var(--radius-sm);
      padding:9px 14px; border:1px solid var(--border-strong); background:var(--surface-2);
      color:var(--text); cursor:pointer; transition:background .12s, border-color .12s, transform .05s;
      white-space:nowrap;
    }
    .btn svg{width:15px; height:15px; flex:none;}
    .btn:hover{background:var(--surface-3); border-color:var(--border-strong);}
    .btn:active{transform:translateY(1px);}
    .btn:disabled{opacity:.45; cursor:not-allowed;}
    .btn-primary{background:var(--teal); border-color:var(--teal); color:#04231f;}
    .btn-primary:hover{background:#3fe0d3;}
    .btn-danger{background:transparent; border-color:rgba(240,86,63,.4); color:#ff9686;}
    .btn-danger:hover{background:var(--red-dim); border-color:var(--red);}
    .btn-ghost{background:transparent; border-color:transparent;}
    .btn-ghost:hover{background:var(--surface-2); border-color:var(--border);}
    .btn-sm{padding:6px 10px; font-size:12px;}
    .btn-block{width:100%;}
    .btn-icon{padding:8px; width:34px; height:34px;}

    /* ============================= APP SHELL ============================= */
    #app{display:flex; min-height:100vh;}

    .sidebar{
      width:var(--sidebar-w); flex:none; background:var(--surface);
      border-right:1px solid var(--border);
      display:flex; flex-direction:column;
      position:sticky; top:0; height:100vh;
    }
    .sidebar-brand{
      display:flex; align-items:center; gap:10px; padding:20px 18px 16px;
      border-bottom:1px solid var(--border);
    }
    .sidebar-brand svg{color:var(--teal); flex:none;}
    .sidebar-brand .wordmark{font-family:var(--font-display); font-weight:700; font-size:15.5px;}
    .sidebar-brand .wordmark span{display:block; font-family:var(--font-body); font-weight:500; font-size:10.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.08em; margin-top:1px;}

    .nav{padding:14px 10px; display:flex; flex-direction:column; gap:2px; flex:1; overflow-y:auto;}
    .nav-item{
      display:flex; align-items:center; gap:10px; padding:9px 11px; border-radius:8px;
      color:var(--text-dim); font-size:13.5px; font-weight:500; cursor:pointer; user-select:none;
      border:1px solid transparent; position:relative;
    }
    .nav-item svg{width:17px; height:17px; flex:none; opacity:.85;}
    .nav-item:hover{background:var(--surface-2); color:var(--text);}
    .nav-item.active{background:var(--teal-dim); color:var(--teal); font-weight:600;}
    .nav-item.active svg{opacity:1;}
    .nav-item .badge{margin-left:auto; font-family:var(--font-mono); font-size:10.5px; font-weight:600; background:var(--surface-3); color:var(--text-dim); padding:1px 6px; border-radius:20px;}
    .nav-item.active .badge{background:rgba(45,212,200,.18); color:var(--teal);}
    .nav-item .badge.alert{background:rgba(240,86,63,.18); color:#ff8f7c;}
    .nav-section-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-faint); padding:14px 11px 6px; font-weight:600;}

    .sidebar-foot{padding:12px; border-top:1px solid var(--border);}
    .conn-pill{
      display:flex; align-items:center; gap:8px; font-size:11.5px; color:var(--text-dim);
      background:var(--surface-2); border:1px solid var(--border); border-radius:20px; padding:6px 10px;
    }
    .dot{width:7px; height:7px; border-radius:50%; flex:none; background:var(--green); box-shadow:0 0 0 3px rgba(56,208,137,.15);}
    .dot.pulse{animation:pulseDot 2s ease-in-out infinite;}
    @keyframes pulseDot{0%,100%{box-shadow:0 0 0 0 rgba(56,208,137,.35);}50%{box-shadow:0 0 0 4px rgba(56,208,137,0);}}

    .main{flex:1; min-width:0; display:flex; flex-direction:column;}
    .topbar{
      position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:14px;
      padding:0 24px; height:60px; background:rgba(10,14,19,.85); backdrop-filter:blur(10px);
      border-bottom:1px solid var(--border);
    }
    .topbar h2{font-size:16px;}
    .topbar .sub{color:var(--text-faint); font-size:12px; margin-left:2px;}
    .topbar-search{
      margin-left:auto; display:flex; align-items:center; gap:8px; background:var(--surface-2);
      border:1px solid var(--border); border-radius:8px; padding:7px 11px; width:240px;
      color:var(--text-faint);
    }
    .topbar-search input{background:none; border:none; outline:none; color:var(--text); font-size:13px; width:100%;}
    .topbar-search svg{flex:none; width:15px; height:15px;}
    .topbar-clock{font-family:var(--font-mono); font-size:11.5px; color:var(--text-faint); white-space:nowrap;}

    .view{padding:24px; flex:1;}
    .view-head{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:18px; flex-wrap:wrap;}
    .view-head .lede{color:var(--text-dim); font-size:13px; margin-top:4px; max-width:52ch; line-height:1.5;}
    .view-actions{display:flex; gap:8px; flex-wrap:wrap;}

    /* ============================= CARDS / GRID ============================= */
    .stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(168px,1fr)); gap:12px; margin-bottom:20px;}
    .stat-card{
      background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
      padding:16px 16px 14px; box-shadow:var(--shadow-card); position:relative; overflow:hidden;
    }
    .stat-card .icon-badge{position:absolute; top:14px; right:14px; opacity:.5;}
    .stat-label{font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.06em; font-weight:600; margin-bottom:8px;}
    .stat-value{font-family:var(--font-display); font-size:27px; font-weight:700;}
    .stat-value.teal{color:var(--teal);} .stat-value.amber{color:var(--amber);} .stat-value.red{color:var(--red);} .stat-value.green{color:var(--green);}
    .stat-foot{font-size:11.5px; color:var(--text-faint); margin-top:6px;}

    .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); box-shadow:var(--shadow-card);}
    .card-head{display:flex; align-items:center; justify-content:space-between; padding:15px 18px; border-bottom:1px solid var(--border); gap:12px; flex-wrap:wrap;}
    .card-head h3{font-size:14.5px;}
    .card-head .count{color:var(--text-faint); font-size:12px; font-weight:500; margin-left:8px;}
    .card-body{padding:16px 18px;}
    .card-body.pad0{padding:0;}

    /* ============================= FLEET PULSE (signature) ============================= */
    .pulse-strip{
      display:flex; align-items:flex-end; gap:3px; height:56px; padding:10px 18px 14px; overflow-x:auto;
    }
    .pulse-bar{
      flex:none; width:5px; border-radius:3px 3px 0 0; cursor:pointer; position:relative;
      transition:transform .12s;
    }
    .pulse-bar:hover{transform:scaleY(1.06);}
    .pulse-bar.online{background:linear-gradient(to top, var(--teal-strong), var(--teal)); animation:pulseBar 2.6s ease-in-out infinite;}
    .pulse-bar.warn{background:linear-gradient(to top, #8a5f1c, var(--amber));}
    .pulse-bar.crit{background:linear-gradient(to top, #7c2c20, var(--red));}
    .pulse-bar.off{background:var(--surface-3);}
    @keyframes pulseBar{0%,100%{opacity:1;}50%{opacity:.55;}}
    .pulse-empty{padding:18px; color:var(--text-faint); font-size:12.5px;}

    /* ============================= SIGNAL STATUS ICON ============================= */
    .signal{display:inline-flex; align-items:flex-end; gap:1.5px; height:12px;}
    .signal i{display:block; width:2.5px; border-radius:1px; background:var(--surface-3);}
    .signal i:nth-child(1){height:4px;} .signal i:nth-child(2){height:7px;} .signal i:nth-child(3){height:10px;} .signal i:nth-child(4){height:13px;}
    .signal.s-online i{background:var(--green);}
    .signal.s-warn i:nth-child(-n+3){background:var(--amber);}
    .signal.s-crit i:nth-child(1){background:var(--red);}
    .signal.s-off i{background:var(--surface-3);}

    /* ============================= TABLE ============================= */
    .table-wrap{overflow-x:auto;}
    table{width:100%; border-collapse:collapse; font-size:13px;}
    thead th{
      text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; font-weight:700;
      color:var(--text-faint); padding:10px 18px; border-bottom:1px solid var(--border); white-space:nowrap;
      background:var(--surface-2);
    }
    tbody td{padding:11px 18px; border-bottom:1px solid var(--border); vertical-align:middle;}
    tbody tr{transition:background .1s;}
    tbody tr.clickable{cursor:pointer;}
    tbody tr.clickable:hover{background:var(--surface-2);}
    tbody tr:last-child td{border-bottom:none;}
    td.num, th.num{text-align:right;}
    .cell-primary{font-weight:600;}
    .cell-sub{color:var(--text-faint); font-size:11.5px; margin-top:2px;}

    /* ============================= BADGES / TAGS ============================= */
    .badge{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; padding:3px 8px; border-radius:20px; white-space:nowrap;}
    .badge.b-green{background:var(--green-dim); color:var(--green);}
    .badge.b-amber{background:var(--amber-dim); color:var(--amber);}
    .badge.b-red{background:var(--red-dim); color:#ff9686;}
    .badge.b-teal{background:var(--teal-dim); color:var(--teal);}
    .badge.b-violet{background:var(--violet-dim); color:var(--violet);}
    .badge.b-blue{background:var(--blue-dim); color:var(--blue);}
    .badge.b-gray{background:var(--surface-3); color:var(--text-dim);}
    .badge svg{width:11px; height:11px;}

    /* progress / battery */
    .meter{width:64px; height:6px; border-radius:4px; background:var(--surface-3); overflow:hidden; flex:none;}
    .meter > i{display:block; height:100%; border-radius:4px;}
    .meter-row{display:flex; align-items:center; gap:8px;}

    /* ============================= EMPTY / LOADING ============================= */
    .empty-state{padding:52px 20px; text-align:center; color:var(--text-faint);}
    .empty-state svg{color:var(--border-strong); margin-bottom:12px;}
    .empty-state .t{color:var(--text-dim); font-weight:600; font-size:13.5px; margin-bottom:4px;}
    .empty-state .d{font-size:12.5px; max-width:36ch; margin:0 auto;}
    .skel{background:linear-gradient(90deg, var(--surface-2) 25%, var(--surface-3) 37%, var(--surface-2) 63%); background-size:400% 100%; animation:skel 1.4s ease infinite; border-radius:6px;}
    @keyframes skel{0%{background-position:100% 50%;}100%{background-position:0 50%;}}

    /* ============================= MEDIA / CONTENT GRID ============================= */
    .media-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:14px;}
    .media-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow-card); display:flex; flex-direction:column;}
    .media-thumb{aspect-ratio:16/9; background:var(--surface-2); display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; color:var(--text-faint);}
    .media-thumb img, .media-thumb video{width:100%; height:100%; object-fit:cover;}
    .media-thumb .type-chip{position:absolute; top:8px; left:8px;}
    .media-body{padding:11px 13px 13px; display:flex; flex-direction:column; gap:6px; flex:1;}
    .media-title{font-weight:600; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
    .media-meta{font-size:11.5px; color:var(--text-faint); display:flex; justify-content:space-between; align-items:center;}
    .media-actions{display:flex; gap:6px; margin-top:auto; padding-top:6px;}

    /* layout template diagram */
    .zone-diagram{display:grid; gap:3px; width:56px; height:36px; flex:none;}
    .zone-diagram i{background:var(--surface-3); border-radius:3px;}
    .zone-diagram i.filled{background:var(--teal); opacity:.75;}

    /* ============================= FORM GRID / GENERIC ============================= */
    .form-row{display:grid; gap:14px;}
    .form-row.cols-2{grid-template-columns:1fr 1fr;}
    .radio-tabs{display:flex; gap:6px; background:var(--surface-3); padding:3px; border-radius:9px;}
    .radio-tabs button{flex:1; border:none; background:none; color:var(--text-dim); padding:7px 8px; font-size:12.5px; font-weight:600; border-radius:7px; cursor:pointer;}
    .radio-tabs button.active{background:var(--surface); color:var(--teal); box-shadow:0 1px 3px rgba(0,0,0,.4);}
    .dropzone{border:1.5px dashed var(--border-strong); border-radius:var(--radius); padding:22px; text-align:center; color:var(--text-faint); font-size:12.5px; cursor:pointer;}
    .dropzone:hover{border-color:var(--teal); color:var(--text-dim);}
    .dropzone.drag{border-color:var(--teal); background:var(--teal-dim);}
    .range-row{display:flex; align-items:center; gap:12px;}
    .range-row input[type=range]{flex:1; accent-color:var(--teal);}
    .range-row .val{font-family:var(--font-mono); font-size:12.5px; color:var(--text-dim); width:38px; text-align:right;}
    .toggle{position:relative; display:inline-block; width:38px; height:22px; flex:none;}
    .toggle input{opacity:0; width:0; height:0;}
    .toggle .track{position:absolute; inset:0; background:var(--surface-3); border-radius:22px; border:1px solid var(--border-strong); transition:.15s;}
    .toggle .track::before{content:''; position:absolute; height:16px; width:16px; left:2px; top:2px; background:var(--text-dim); border-radius:50%; transition:.15s;}
    .toggle input:checked + .track{background:var(--teal-dim); border-color:var(--teal);}
    .toggle input:checked + .track::before{transform:translateX(16px); background:var(--teal);}

    /* command action grid (device drawer) */
    .action-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:8px;}
    .action-btn{
      display:flex; flex-direction:column; align-items:flex-start; gap:6px; padding:12px; text-align:left;
      background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm); cursor:pointer; color:var(--text);
    }
    .action-btn:hover{border-color:var(--border-strong); background:var(--surface-3);}
    .action-btn svg{color:var(--teal);}
    .action-btn .label{font-size:12.5px; font-weight:600;}
    .action-btn .desc{font-size:10.5px; color:var(--text-faint); line-height:1.4;}
    .action-btn.danger svg{color:var(--red);}

    .inline-form{display:flex; gap:8px; align-items:center;}
    .inline-form input, .inline-form select{flex:1;}

    fieldset{border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px 14px; margin:0 0 14px;}
    legend{font-size:11.5px; font-weight:700; color:var(--text-dim); text-transform:uppercase; letter-spacing:.04em; padding:0 6px;}

    .divider{height:1px; background:var(--border); margin:16px 0; border:none;}

    .timeline{display:flex; flex-direction:column;}
    .timeline-item{display:flex; gap:12px; padding:10px 0; border-bottom:1px solid var(--border);}
    .timeline-item:last-child{border-bottom:none;}
    .timeline-dot{width:8px; height:8px; border-radius:50%; margin-top:5px; flex:none;}
    .timeline-body{flex:1; min-width:0;}
    .timeline-title{font-size:12.5px; font-weight:600;}
    .timeline-meta{font-size:11px; color:var(--text-faint); margin-top:2px;}

    /* mini sparkline */
    .spark{width:100%; height:64px; display:block;}

    /* ============================= DRAWER ============================= */
    .overlay{position:fixed; inset:0; background:rgba(4,7,10,.6); backdrop-filter:blur(2px); z-index:60; opacity:0; pointer-events:none; transition:opacity .18s;}
    .overlay.show{opacity:1; pointer-events:auto;}
    .drawer{
      position:fixed; top:0; right:0; height:100vh; width:480px; max-width:92vw; background:var(--surface);
      border-left:1px solid var(--border); z-index:61; transform:translateX(100%); transition:transform .22s cubic-bezier(.2,.8,.2,1);
      display:flex; flex-direction:column; box-shadow:-24px 0 60px -20px rgba(0,0,0,.6);
    }
    .drawer.show{transform:translateX(0);}
    .drawer-head{padding:18px 20px; border-bottom:1px solid var(--border); display:flex; align-items:flex-start; justify-content:space-between; gap:10px;}
    .drawer-title{font-family:var(--font-display); font-size:16.5px; font-weight:700;}
    .drawer-sub{font-family:var(--font-mono); font-size:11.5px; color:var(--text-faint); margin-top:3px;}
    .drawer-tabs{display:flex; gap:2px; padding:0 20px; border-bottom:1px solid var(--border); background:var(--surface);}
    .drawer-tab{padding:11px 4px; margin-right:20px; font-size:12.5px; font-weight:600; color:var(--text-faint); cursor:pointer; border-bottom:2px solid transparent;}
    .drawer-tab.active{color:var(--teal); border-bottom-color:var(--teal);}
    .drawer-body{flex:1; overflow-y:auto; padding:18px 20px;}

    /* ============================= MODAL ============================= */
    .modal-root{position:fixed; inset:0; z-index:70; display:flex; align-items:center; justify-content:center; padding:20px; opacity:0; pointer-events:none; transition:opacity .15s;}
    .modal-root.show{opacity:1; pointer-events:auto;}
    .modal-back{position:absolute; inset:0; background:rgba(4,7,10,.68); backdrop-filter:blur(2px);}
    .modal{position:relative; width:100%; max-width:520px; max-height:88vh; overflow-y:auto; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); box-shadow:var(--shadow-pop); transform:scale(.97) translateY(6px); transition:transform .18s cubic-bezier(.2,.8,.2,1);}
    .modal-root.show .modal{transform:scale(1) translateY(0);}
    .modal-head{padding:18px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between;}
    .modal-head h3{font-size:15px;}
    .modal-body{padding:18px 20px;}
    .modal-foot{padding:14px 20px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:8px;}

    /* ============================= TOASTS ============================= */
    .toast-root{position:fixed; bottom:20px; right:20px; z-index:90; display:flex; flex-direction:column; gap:8px; width:320px; max-width:90vw;}
    .toast{
      background:var(--surface-2); border:1px solid var(--border-strong); border-radius:var(--radius-sm); padding:12px 14px;
      display:flex; align-items:flex-start; gap:10px; box-shadow:var(--shadow-pop); font-size:12.5px; line-height:1.45;
      animation:toastIn .18s cubic-bezier(.2,.8,.2,1);
    }
    @keyframes toastIn{from{opacity:0; transform:translateY(6px);}to{opacity:1; transform:translateY(0);}}
    .toast.ok{border-left:3px solid var(--green);}
    .toast.err{border-left:3px solid var(--red);}
    .toast.info{border-left:3px solid var(--blue);}
    .toast svg{flex:none; margin-top:1px;}

    /* ============================= MISC ============================= */
    .avatar-square{width:32px; height:32px; border-radius:8px; background:var(--surface-3); display:flex; align-items:center; justify-content:center; flex:none; color:var(--text-dim); font-family:var(--font-mono); font-size:11px; font-weight:600;}
    .flex{display:flex; align-items:center;}
    .gap8{gap:8px;} .gap10{gap:10px;} .gap12{gap:12px;}
    .grow{flex:1;}
    .checkbox{width:15px; height:15px; accent-color:var(--teal);}

    @media (max-width: 880px){
      .sidebar{position:fixed; z-index:50; transform:translateX(-100%); transition:transform .2s;}
      .sidebar.open{transform:translateX(0);}
      .topbar-search{display:none;}
      .drawer{width:100vw; max-width:100vw;}
      .action-grid{grid-template-columns:1fr;}
      .form-row.cols-2{grid-template-columns:1fr;}
    }
  </style>
</head>
<body>

<!-- ============================= CONNECT / LOGIN GATE ============================= -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-mark">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4" stroke-linecap="round"/><path d="M7 9l2 2-2 2M13 13h4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div class="wordmark">DMS Control<span>Fleet Dashboard</span></div>
    </div>
    <h1>Sign in to your fleet</h1>
    <p>Enter the admin token for this backend. It's set as <code class="mono">ADMIN_TOKEN</code> on the server — ask whoever deployed it if you don't have one.</p>
    <div id="loginError" class="login-error"></div>
    <form id="loginForm">
      <div class="field">
        <label for="apiBase">Backend URL</label>
        <input id="apiBase" type="text" placeholder="https://your-dms-backend.onrender.com" autocomplete="off" />
        <div class="hint">Leave as-is if this dashboard is served by the same backend.</div>
      </div>
      <div class="field">
        <label for="adminToken">Admin token</label>
        <input id="adminToken" type="password" placeholder="Paste token — leave blank if auth is disabled" autocomplete="off" />
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Connect</button>
    </form>
  </div>
</div>

<!-- ============================= APP SHELL ============================= -->
<div id="app" class="hidden">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4" stroke-linecap="round"/><path d="M7 9l2 2-2 2M13 13h4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div class="wordmark">DMS Control<span>Fleet Dashboard</span></div>
    </div>
    <nav class="nav" id="navList"></nav>
    <div class="sidebar-foot">
      <div class="conn-pill"><span class="dot pulse" id="connDot"></span><span id="connLabel">Connected</span></div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="btn btn-ghost btn-icon hidden" id="menuToggle" aria-label="Toggle menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18" stroke-linecap="round"/></svg>
      </button>
      <div>
        <h2 id="topbarTitle">Overview</h2>
      </div>
      <span class="sub" id="topbarSub"></span>
      <div class="topbar-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3" stroke-linecap="round"/></svg>
        <input id="globalSearch" placeholder="Search devices…" />
      </div>
      <span class="topbar-clock" id="topbarClock"></span>
      <button class="btn btn-ghost btn-icon" id="refreshBtn" title="Refresh now" aria-label="Refresh">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 10-3.2 6.9M21 4v6h-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </header>
    <main class="view" id="view"></main>
  </div>
</div>

<div class="overlay" id="overlay"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <div>
      <div class="drawer-title" id="drawerTitle">—</div>
      <div class="drawer-sub" id="drawerSub">—</div>
    </div>
    <button class="btn btn-ghost btn-icon" id="drawerClose" aria-label="Close">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div class="drawer-tabs" id="drawerTabs"></div>
  <div class="drawer-body" id="drawerBody"></div>
</div>

<div class="modal-root" id="modalRoot">
  <div class="modal-back" id="modalBack"></div>
  <div class="modal" id="modal"></div>
</div>

<div class="toast-root" id="toastRoot"></div>

<script>
  /* =====================================================================
     DMS CONTROL — vanilla JS, no build step (matches the rest of this
     backend: Express serving a static file). Organized top to bottom:
     icons -> api client -> state -> utils -> shell/nav -> per-section
     views -> drawer (device detail) -> modals (create/upload/assign) ->
     bulk actions -> boot.
     ===================================================================== */

  /* ============================= ICONS ============================= */
  const ICONS = {
    overview:'<path d="M3 13h6V3H3v10zM3 21h6v-4H3v4zM11 21h6V11h-6v10zM11 3v4h6V3h-6z"/>',
    devices:'<rect x="4" y="3" width="16" height="12" rx="2"/><path d="M9 21h6M12 15v6" stroke-linecap="round"/>',
    groups:'<path d="M4 7l8-4 8 4-8 4-8-4z"/><path d="M4 12l8 4 8-4M4 17l8 4 8-4" stroke-linecap="round" stroke-linejoin="round"/>',
    content:'<rect x="3" y="4" width="18" height="14" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M21 15l-5-5-9 9" stroke-linecap="round" stroke-linejoin="round"/>',
    layouts:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9" stroke-linecap="round"/>',
    apps:'<path d="M12 3l3 3-3 3-3-3 3-3z"/><path d="M4 12l8 5 8-5M4 12v5l8 5 8-5v-5" stroke-linecap="round" stroke-linejoin="round"/>',
    alerts:'<path d="M12 3a6 6 0 00-6 6v4l-2 3h16l-2-3V9a6 6 0 00-6-6z" stroke-linejoin="round"/><path d="M9.5 20a2.5 2.5 0 005 0" stroke-linecap="round"/>',
    plus:'<path d="M12 5v14M5 12h14" stroke-linecap="round"/>',
    trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13" stroke-linecap="round" stroke-linejoin="round"/>',
    download:'<path d="M12 3v12M7 10l5 5 5-5" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 19h16" stroke-linecap="round"/>',
    upload:'<path d="M12 21V9M7 14l5-5 5 5" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 21h16" stroke-linecap="round"/>',
    refresh:'<path d="M21 12a9 9 0 10-3.2 6.9M21 4v6h-6" stroke-linecap="round" stroke-linejoin="round"/>',
    battery:'<rect x="2" y="7" width="18" height="10" rx="2"/><path d="M22 10v4" stroke-linecap="round"/>',
    plug:'<path d="M9 2v6M15 2v6M6 8h12l-1 5a5 5 0 01-10 0L6 8z" stroke-linejoin="round"/><path d="M12 17v5" stroke-linecap="round"/>',
    volume:'<path d="M4 9v6h4l5 4V5L8 9H4z" stroke-linejoin="round"/><path d="M17 8a5 5 0 010 8" stroke-linecap="round"/>',
    sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke-linecap="round"/>',
    lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 118 0v4" stroke-linecap="round"/>',
    unlock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 017.4-2" stroke-linecap="round"/>',
    power:'<path d="M12 2v8" stroke-linecap="round"/><path d="M6.5 6.5a8 8 0 1011 0" stroke-linecap="round"/>',
    message:'<path d="M4 5h16v11H8l-4 4V5z" stroke-linejoin="round"/>',
    send:'<path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" stroke-linejoin="round"/>',
    install:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 12l3 3 3-3M12 7v8" stroke-linecap="round" stroke-linejoin="round"/>',
    ad:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h10M7 12h10M7 16h6" stroke-linecap="round"/>',
    clear:'<path d="M18 6L6 18M6 6l12 12" stroke-linecap="round"/>',
    clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3" stroke-linecap="round" stroke-linejoin="round"/>',
    chevRight:'<path d="M9 18l6-6-6-6" stroke-linecap="round" stroke-linejoin="round"/>',
    chevDown:'<path d="M6 9l6 6 6-6" stroke-linecap="round" stroke-linejoin="round"/>',
    check:'<path d="M20 6L9 17l-5-5" stroke-linecap="round" stroke-linejoin="round"/>',
    x:'<path d="M18 6L6 18M6 6l12 12" stroke-linecap="round"/>',
    link:'<path d="M10 14a5 5 0 007 0l3-3a5 5 0 00-7-7l-1.5 1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 10a5 5 0 00-7 0l-3 3a5 5 0 007 7l1.5-1.5" stroke-linecap="round" stroke-linejoin="round"/>',
    copy:'<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 012-2h10" stroke-linecap="round"/>',
    info:'<circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v5h1" stroke-linecap="round" stroke-linejoin="round"/>',
    warn:'<path d="M12 3l10 18H2L12 3z" stroke-linejoin="round"/><path d="M12 9v5h.01M12 17h.01" stroke-linecap="round"/>',
    danger:'<circle cx="12" cy="12" r="9"/><path d="M15 9l-6 6M9 9l6 6" stroke-linecap="round"/>',
    monitor:'<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4" stroke-linecap="round"/>',
    folder:'<path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V7z" stroke-linejoin="round"/>',
    image:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M21 15l-5-5-9 9" stroke-linecap="round" stroke-linejoin="round"/>',
    video:'<rect x="3" y="5" width="14" height="14" rx="2"/><path d="M17 10l4-3v10l-4-3" stroke-linejoin="round"/>',
    web:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 010 18M12 3a14 14 0 000 18" stroke-linecap="round"/>',
    text:'<path d="M5 6h14M5 12h14M5 18h9" stroke-linecap="round"/>',
    bell:'<path d="M12 3a6 6 0 00-6 6v4l-2 3h16l-2-3V9a6 6 0 00-6-6z" stroke-linejoin="round"/><path d="M9.5 20a2.5 2.5 0 005 0" stroke-linecap="round"/>',
    spark:'<path d="M12 2l1.6 5.3L19 9l-5.4 1.7L12 16l-1.6-5.3L5 9l5.4-1.7L12 2z" stroke-linejoin="round"/>',
    logout:'<path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4" stroke-linecap="round"/><path d="M16 17l5-5-5-5M21 12H9" stroke-linecap="round" stroke-linejoin="round"/>',
  };
  function icon(name, size=16){
    return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">${ICONS[name]||''}</svg>`;
  }

  /* ============================= STATE ============================= */
  const state = {
    base: '',
    token: '',
    section: 'overview',
    devices: [], groups: [], ads: [], layouts: [], layoutTemplates: {}, apks: [], alerts: [],
    loaded: false,
    search: '',
    deviceSort: { key: 'last_seen', dir: 'desc' },
    selectedDeviceIds: new Set(),
    autoRefreshTimer: null,
  };

  const TEMPLATE_ZONES_FALLBACK = {
    split2: ['left','right'],
    split3: ['main','top_right','bottom_right'],
    grid4: ['top_left','top_right','bottom_left','bottom_right'],
    pip: ['main','pip'],
    ticker: ['main','ticker'],
    ticker_top: ['main','ticker'],
  };

  /* ============================= API CLIENT ============================= */
  async function api(path, opts={}){
    const headers = opts.headers ? {...opts.headers} : {};
    if (state.token) headers['Authorization'] = 'Bearer ' + state.token;
    if (opts.json !== undefined){
      headers['Content-Type'] = 'application/json';
      opts.body = JSON.stringify(opts.json);
    }
    let res;
    try{
      res = await fetch(state.base + path, { ...opts, headers });
    }catch(e){
      throw new Error('Network error — could not reach the backend at ' + state.base);
    }
    if (res.status === 401){
      toast('Session expired or token invalid — please reconnect.', 'err');
      doLogout();
      throw new Error('unauthorized');
    }
    let data = null;
    const ct = res.headers.get('content-type') || '';
    if (ct.includes('application/json')) data = await res.json().catch(()=>null);
    if (!res.ok){
      throw new Error((data && data.error) || `request failed (${res.status})`);
    }
    return data;
  }

  /* ============================= UTILS ============================= */
  function fmtBytes(n){
    if (n == null) return '—';
    n = Number(n);
    if (n < 1024) return n + ' B';
    const units = ['KB','MB','GB','TB'];
    let u = -1;
    do { n /= 1024; u++; } while (n >= 1024 && u < units.length-1);
    return n.toFixed(n < 10 ? 1 : 0) + ' ' + units[u];
  }
  function fmtRelTime(iso){
    if (!iso) return 'never';
    const diffMs = Date.now() - new Date(iso).getTime();
    const min = Math.floor(diffMs/60000);
    if (min < 1) return 'just now';
    if (min < 60) return min + 'm ago';
    const hr = Math.floor(min/60);
    if (hr < 24) return hr + 'h ago';
    const d = Math.floor(hr/24);
    if (d < 30) return d + 'd ago';
    return new Date(iso).toLocaleDateString();
  }
  function fmtDate(iso){ if(!iso) return '—'; return new Date(iso).toLocaleString(undefined,{month:'short',day:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function minutesSince(iso){ if(!iso) return Infinity; return (Date.now() - new Date(iso).getTime())/60000; }

  // Mirrors the backend's default alert thresholds (alerts.js) purely for
  // instant client-side status coloring; GET /api/alerts remains the source
  // of truth for the actual alert list (thresholds may be overridden via env).
  const OFFLINE_MIN = 20, LOW_BATTERY = 20, LOW_STORAGE = 1024**3;

  function deviceStatus(d){
    const mins = minutesSince(d.last_seen);
    if (mins >= OFFLINE_MIN) return 'off';
    if ((d.battery != null && d.battery < LOW_BATTERY) || (d.storage_free != null && d.storage_free < LOW_STORAGE)) return 'warn';
    if (d.power_connected === false && d.battery != null && d.battery < 40) return 'warn';
    return 'online';
  }
  function statusMeta(s){
    return {
      online:{label:'Online', badge:'b-green', dot:'var(--green)'},
      warn:{label:'Attention', badge:'b-amber', dot:'var(--amber)'},
      crit:{label:'Critical', badge:'b-red', dot:'var(--red)'},
      off:{label:'Offline', badge:'b-gray', dot:'var(--text-faint)'},
    }[s];
  }
  function signalIcon(s){
    return `<span class="signal s-${s==='online'?'online':s==='warn'?'warn':s==='crit'?'crit':'off'}"><i></i><i></i><i></i><i></i></span>`;
  }
  function deviceLabel(d){ return d.name || d.device_id; }

  function debounce(fn, ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a), ms); }; }

  /* ============================= TOASTS ============================= */
  function toast(msg, type='info'){
    const root = document.getElementById('toastRoot');
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    const ic = type==='ok'?'check':type==='err'?'danger':'info';
    const color = type==='ok'?'var(--green)':type==='err'?'var(--red)':'var(--blue)';
    el.innerHTML = `<span style="color:${color}">${icon(ic,15)}</span><span>${esc(msg)}</span>`;
    root.appendChild(el);
    setTimeout(()=>{ el.style.transition='opacity .25s, transform .25s'; el.style.opacity='0'; el.style.transform='translateY(6px)'; setTimeout(()=>el.remove(), 260); }, 3800);
  }

  /* ============================= MODAL ============================= */
  function openModal(html, {wide=false}={}){
    const modal = document.getElementById('modal');
    modal.style.maxWidth = wide ? '680px' : '520px';
    modal.innerHTML = html;
    document.getElementById('modalRoot').classList.add('show');
    document.body.style.overflow = 'hidden';
  }
  function closeModal(){
    document.getElementById('modalRoot').classList.remove('show');
    document.body.style.overflow = '';
    setTimeout(()=>{ document.getElementById('modal').innerHTML=''; }, 150);
  }
  document.getElementById('modalBack').addEventListener('click', closeModal);

  function confirmAction(message, {danger=true, confirmLabel='Delete'}={}){
    return new Promise(resolve=>{
      openModal(`
        <div class="modal-head"><h3>Are you sure?</h3></div>
        <div class="modal-body"><p style="color:var(--text-dim); font-size:13px; line-height:1.6; margin:0;">${esc(message)}</p></div>
        <div class="modal-foot">
          <button class="btn" id="cfNo">Cancel</button>
          <button class="btn ${danger?'btn-danger':'btn-primary'}" id="cfYes">${esc(confirmLabel)}</button>
        </div>
      `);
      document.getElementById('cfNo').onclick = ()=>{ closeModal(); resolve(false); };
      document.getElementById('cfYes').onclick = ()=>{ closeModal(); resolve(true); };
    });
  }

  /* ============================= DRAWER ============================= */
  function openDrawer(){
    document.getElementById('overlay').classList.add('show');
    document.getElementById('drawer').classList.add('show');
    document.body.style.overflow = 'hidden';
  }
  function closeDrawer(){
    document.getElementById('overlay').classList.remove('show');
    document.getElementById('drawer').classList.remove('show');
    document.body.style.overflow = '';
  }
  document.getElementById('overlay').addEventListener('click', closeDrawer);
  document.getElementById('drawerClose').addEventListener('click', closeDrawer);

  // Global delegated handlers — work regardless of when the target element
  // was rendered, so per-view render functions don't need to rebind these.
  document.addEventListener('click', (e)=>{
    const openDev = e.target.closest('[data-open-device]');
    if (openDev){ openDeviceDrawer(openDev.dataset.openDevice); return; }
    const navTo = e.target.closest('[data-nav-to]');
    if (navTo){ navigate(navTo.dataset.navTo); return; }
  });

  /* ============================= LOGIN / BOOT ============================= */
  function doLogout(){
    localStorage.removeItem('dms_base');
    localStorage.removeItem('dms_token');
    location.reload();
  }

  document.getElementById('loginForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const base = document.getElementById('apiBase').value.trim().replace(/\/$/,'') || '';
    const token = document.getElementById('adminToken').value.trim();
    const btn = document.getElementById('loginBtn');
    const errBox = document.getElementById('loginError');
    errBox.style.display = 'none';
    btn.disabled = true; btn.textContent = 'Connecting…';
    state.base = base; state.token = token;
    try{
      await api('/api/health');
      // A protected call verifies the token (health is intentionally public).
      await api('/api/devices');
      localStorage.setItem('dms_base', base);
      localStorage.setItem('dms_token', token);
      enterApp();
    }catch(err){
      errBox.textContent = err.message === 'unauthorized' ? 'Invalid admin token.' : err.message;
      errBox.style.display = 'block';
    }finally{
      btn.disabled = false; btn.textContent = 'Connect';
    }
  });

  function enterApp(){
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    buildNav();
    loadAll(true);
    setInterval(()=>{ document.getElementById('topbarClock').textContent = new Date().toLocaleTimeString(); }, 1000);
    state.autoRefreshTimer = setInterval(()=>loadAll(false), 30000);
  }

  (function boot(){
    const savedBase = localStorage.getItem('dms_base');
    const savedToken = localStorage.getItem('dms_token');
    document.getElementById('apiBase').value = savedBase ?? location.origin;
    if (savedBase !== null || savedToken){
      state.base = savedBase || '';
      state.token = savedToken || '';
      api('/api/devices').then(()=>enterApp()).catch(()=>{ /* fall back to login form, prefilled */
        document.getElementById('adminToken').value = savedToken || '';
      });
    }
  })();

  /* ============================= NAV / ROUTER ============================= */
  const SECTIONS = [
    { id:'overview', label:'Overview', icon:'overview' },
    { id:'devices', label:'Devices', icon:'devices', countKey:'devices' },
    { id:'groups', label:'Groups', icon:'groups', countKey:'groups' },
    { id:'content', label:'Content Library', icon:'content', countKey:'ads' },
    { id:'layouts', label:'Layouts', icon:'layouts', countKey:'layouts' },
    { id:'apps', label:'Applications', icon:'apps', countKey:'apks' },
    { id:'alerts', label:'Alerts', icon:'alerts', countKey:'alerts', alertKey:true },
  ];
  const SECTION_SUB = {
    overview:'Fleet health at a glance', devices:'Every screen you manage, live',
    groups:'Organize devices for bulk control', content:'Images, video, web pages & text',
    layouts:'Multi-zone screen templates', apps:'APKs you can push to any device', alerts:'Devices needing attention',
  };

  function buildNav(){
    const nav = document.getElementById('navList');
    nav.innerHTML = SECTIONS.map(s=>`
      <div class="nav-item ${state.section===s.id?'active':''}" data-nav="${s.id}">
        ${icon(s.icon,17)}<span>${s.label}</span>
        <span class="badge ${s.alertKey && state[s.countKey]?.length ? 'alert':''}" id="navcount-${s.id}"></span>
      </div>`).join('');
    nav.querySelectorAll('[data-nav]').forEach(el=>{
      el.addEventListener('click', ()=>navigate(el.dataset.nav));
    });
    updateNavCounts();
  }
  function updateNavCounts(){
    SECTIONS.forEach(s=>{
      const el = document.getElementById('navcount-'+s.id);
      if (!el || !s.countKey) return;
      const n = (state[s.countKey]||[]).length;
      el.textContent = n;
      el.style.display = n ? 'inline-flex' : 'none';
      el.classList.toggle('alert', !!(s.alertKey && n));
    });
  }
  function navigate(id){
    state.section = id;
    document.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('active', el.dataset.nav===id));
    document.getElementById('topbarTitle').textContent = SECTIONS.find(s=>s.id===id).label;
    document.getElementById('topbarSub').textContent = SECTION_SUB[id] || '';
    document.getElementById('sidebar').classList.remove('open');
    renderView();
  }
  document.getElementById('menuToggle').addEventListener('click', ()=>document.getElementById('sidebar').classList.toggle('open'));
  document.getElementById('refreshBtn').addEventListener('click', ()=>{ loadAll(false); toast('Refreshed', 'ok'); });
  document.getElementById('globalSearch').addEventListener('input', debounce(e=>{
    state.search = e.target.value.trim().toLowerCase();
    if (state.section !== 'devices') navigate('devices'); else renderView();
  }, 220));

  /* ============================= DATA LOAD ============================= */
  async function loadAll(first){
    const dot = document.getElementById('connDot'), label = document.getElementById('connLabel');
    try{
      const [devicesRes, groupsRes, adsRes, layoutsRes, apksRes, alertsRes] = await Promise.all([
        api('/api/devices'), api('/api/groups'), api('/api/ads'), api('/api/layouts'), api('/api/apks'), api('/api/alerts'),
      ]);
      state.devices = devicesRes.devices || [];
      state.groups = groupsRes.groups || [];
      state.ads = adsRes.ads || [];
      state.layouts = layoutsRes.layouts || [];
      state.layoutTemplates = layoutsRes.templates || TEMPLATE_ZONES_FALLBACK;
      state.apks = apksRes.apks || [];
      state.alerts = alertsRes.alerts || [];
      state.loaded = true;
      dot.style.background = 'var(--green)'; label.textContent = 'Connected';
      updateNavCounts();
      renderView();
    }catch(err){
      dot.style.background = 'var(--red)'; label.textContent = 'Connection issue';
      if (first) toast(err.message, 'err');
    }
  }

  /* ============================= VIEW DISPATCH ============================= */
  function renderView(){
    const v = document.getElementById('view');
    const renderers = { overview:renderOverview, devices:renderDevices, groups:renderGroups, content:renderContent, layouts:renderLayouts, apps:renderApps, alerts:renderAlerts };
    v.innerHTML = renderers[state.section] ? renderers[state.section]() : '';
    wireSectionEvents();
  }

  /* ============================= OVERVIEW ============================= */
  function renderOverview(){
    const devices = state.devices;
    const online = devices.filter(d=>deviceStatus(d)==='online').length;
    const offline = devices.filter(d=>deviceStatus(d)==='off').length;
    const needsAttention = state.alerts.length;
    const avgBattery = (()=>{ const vals = devices.filter(d=>d.battery!=null).map(d=>d.battery); return vals.length ? Math.round(vals.reduce((a,b)=>a+b,0)/vals.length) : null; })();

    const pulse = devices.length === 0 ? `<div class="pulse-empty">No devices have checked in yet. Once your Android agents send a heartbeat, they'll show up here.</div>` :
      `<div class="pulse-strip">${devices.slice().sort((a,b)=>(a.device_id>b.device_id?1:-1)).map(d=>{
        const s = deviceStatus(d);
        const h = s==='online' ? 100 : s==='warn' ? 62 : 30;
        return `<div class="pulse-bar ${s==='off'?'off':s==='warn'?'warn':'online'}" style="height:${h}%" data-open-device="${esc(d.device_id)}" title="${esc(deviceLabel(d))} — ${statusMeta(s).label}"></div>`;
      }).join('')}</div>`;

    const recentAlerts = state.alerts.slice(0,6);
    const alertsHtml = recentAlerts.length === 0
      ? `<div class="empty-state" style="padding:32px 16px;">${icon('check',28)}<div class="t">All clear</div><div class="d">No devices are currently offline, low on battery, or low on storage.</div></div>`
      : `<div class="timeline">${recentAlerts.map(a=>`
          <div class="timeline-item">
            <span class="timeline-dot" style="background:${a.alerts.some(x=>x.type==='offline')?'var(--red)':'var(--amber)'}"></span>
            <div class="timeline-body">
              <div class="timeline-title">${esc(a.name || a.device_id)}</div>
              <div class="timeline-meta">${a.alerts.map(x=>esc(x.message)).join(' · ')}</div>
            </div>
            <button class="btn btn-sm btn-ghost" data-open-device="${esc(a.device_id)}">View</button>
          </div>`).join('')}</div>`;

    return `
      <div class="view-head">
        <div><h1 style="font-size:20px;">Fleet overview</h1><div class="lede">Live status across every registered screen, refreshed every 30s.</div></div>
        <div class="view-actions">
          <button class="btn" data-nav-to="content">${icon('upload')} Upload content</button>
          <button class="btn btn-primary" data-nav-to="layouts">${icon('plus')} New layout</button>
        </div>
      </div>

      <div class="stat-grid">
        <div class="stat-card"><span class="icon-badge" style="color:var(--teal)">${icon('devices',20)}</span><div class="stat-label">Total devices</div><div class="stat-value">${devices.length}</div><div class="stat-foot">${state.groups.length} group${state.groups.length===1?'':'s'}</div></div>
        <div class="stat-card"><span class="icon-badge" style="color:var(--green)">${icon('power',20)}</span><div class="stat-label">Online now</div><div class="stat-value green">${online}</div><div class="stat-foot">heartbeat within ${OFFLINE_MIN} min</div></div>
        <div class="stat-card"><span class="icon-badge" style="color:var(--text-faint)">${icon('monitor',20)}</span><div class="stat-label">Offline</div><div class="stat-value">${offline}</div><div class="stat-foot">no recent heartbeat</div></div>
        <div class="stat-card"><span class="icon-badge" style="color:var(--amber)">${icon('alerts',20)}</span><div class="stat-label">Needs attention</div><div class="stat-value ${needsAttention?'amber':''}">${needsAttention}</div><div class="stat-foot">low battery, storage or offline</div></div>
        <div class="stat-card"><span class="icon-badge" style="color:var(--violet)">${icon('content',20)}</span><div class="stat-label">Content items</div><div class="stat-value">${state.ads.length}</div><div class="stat-foot">${state.layouts.length} layout${state.layouts.length===1?'':'s'} built</div></div>
        <div class="stat-card"><span class="icon-badge" style="color:var(--blue)">${icon('battery',20)}</span><div class="stat-label">Avg. battery</div><div class="stat-value ${avgBattery!=null && avgBattery<30 ? 'amber':''}">${avgBattery!=null?avgBattery+'%':'—'}</div><div class="stat-foot">across reporting devices</div></div>
      </div>

      <div class="card" style="margin-bottom:16px;">
        <div class="card-head"><h3>Fleet pulse</h3><span class="text-faint" style="font-size:11.5px;">bar height = signal health, click to inspect</span></div>
        <div class="card-body pad0">${pulse}</div>
      </div>

      <div style="display:grid; grid-template-columns:1.4fr 1fr; gap:16px;" class="ov-grid">
        <div class="card">
          <div class="card-head"><h3>Devices</h3><button class="btn btn-sm" data-nav-to="devices">View all ${icon('chevRight',13)}</button></div>
          <div class="card-body pad0 table-wrap">
            <table><thead><tr><th>Device</th><th>Status</th><th class="num">Battery</th><th>Last seen</th></tr></thead>
            <tbody>${devices.slice(0,6).map(d=>{
              const s = deviceStatus(d);
              return `<tr class="clickable" data-open-device="${esc(d.device_id)}">
                <td><div class="cell-primary">${esc(deviceLabel(d))}</div><div class="cell-sub mono">${esc(d.device_id)}</div></td>
                <td><span class="badge ${statusMeta(s).badge}">${signalIcon(s)} ${statusMeta(s).label}</span></td>
                <td class="num mono">${d.battery!=null?d.battery+'%':'—'}</td>
                <td class="text-dim">${fmtRelTime(d.last_seen)}</td>
              </tr>`;
            }).join('') || `<tr><td colspan="4"><div class="empty-state">${icon('devices',28)}<div class="t">No devices yet</div><div class="d">Install the DMS Agent app on a screen to see it here.</div></div></td></tr>`}</tbody></table>
          </div>
        </div>
        <div class="card">
          <div class="card-head"><h3>Recent alerts</h3><button class="btn btn-sm" data-nav-to="alerts">View all ${icon('chevRight',13)}</button></div>
          <div class="card-body">${alertsHtml}</div>
        </div>
      </div>
      <style>@media(max-width:1000px){.ov-grid{grid-template-columns:1fr !important;}}</style>
    `;
  }

  /* ============================= DEVICES ============================= */
  let deviceFilterStatus = 'all';
  let deviceFilterGroup = 'all';

  function filteredDevices(){
    let list = state.devices.slice();
    if (state.search){
      list = list.filter(d => deviceLabel(d).toLowerCase().includes(state.search) || d.device_id.toLowerCase().includes(state.search));
    }
    if (deviceFilterStatus !== 'all') list = list.filter(d => deviceStatus(d) === deviceFilterStatus);
    if (deviceFilterGroup !== 'all') list = list.filter(d => String(d.group_id) === deviceFilterGroup);
    const { key, dir } = state.deviceSort;
    list.sort((a,b)=>{
      let av = a[key], bv = b[key];
      if (key === 'last_seen'){ av = av ? new Date(av).getTime() : -1; bv = bv ? new Date(bv).getTime() : -1; }
      if (av == null) av = -1; if (bv == null) bv = -1;
      if (av < bv) return dir==='asc' ? -1 : 1;
      if (av > bv) return dir==='asc' ? 1 : -1;
      return 0;
    });
    return list;
  }

  function renderDevices(){
    const list = filteredDevices();
    const groupOptions = state.groups.map(g=>`<option value="${g.id}">${esc(g.name)} (${g.device_count})</option>`).join('');
    const selCount = state.selectedDeviceIds.size;

    return `
      <div class="view-head">
        <div><h1 style="font-size:20px;">Devices</h1><div class="lede">${state.devices.length} registered · ${state.devices.filter(d=>deviceStatus(d)==='online').length} online right now.</div></div>
        <div class="view-actions">
          <select id="filterStatus" class="btn" style="padding:8px 10px;">
            <option value="all" ${deviceFilterStatus==='all'?'selected':''}>All statuses</option>
            <option value="online" ${deviceFilterStatus==='online'?'selected':''}>Online</option>
            <option value="warn" ${deviceFilterStatus==='warn'?'selected':''}>Needs attention</option>
            <option value="off" ${deviceFilterStatus==='off'?'selected':''}>Offline</option>
          </select>
          <select id="filterGroup" class="btn" style="padding:8px 10px;">
            <option value="all" ${deviceFilterGroup==='all'?'selected':''}>All groups</option>
            ${groupOptions}
          </select>
        </div>
      </div>

      ${selCount>0 ? `
      <div class="card" style="margin-bottom:14px; border-color:var(--teal);">
        <div class="card-body" style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
          <span class="badge b-teal">${selCount} selected</span>
          <div id="bulkCommandArea" style="flex:1; min-width:260px;"></div>
          <button class="btn btn-sm btn-ghost" id="clearSelection">Clear</button>
        </div>
      </div>` : ''}

      <div class="card">
        <div class="card-body pad0 table-wrap">
          <table>
            <thead><tr>
              <th style="width:34px;"><input type="checkbox" class="checkbox" id="selectAllDevices" ${selCount && selCount===list.length ? 'checked':''}></th>
              <th data-sort="name">Device ${sortArrow('name')}</th>
              <th>Status</th>
              <th>Group</th>
              <th class="num" data-sort="battery">Battery ${sortArrow('battery')}</th>
              <th class="num">Storage free</th>
              <th data-sort="app_version">Agent ${sortArrow('app_version')}</th>
              <th data-sort="last_seen">Last seen ${sortArrow('last_seen')}</th>
              <th></th>
            </tr></thead>
            <tbody>
              ${list.map(d=>{
                const s = deviceStatus(d);
                const battColor = d.battery==null ? 'var(--surface-3)' : d.battery<20?'var(--red)':d.battery<40?'var(--amber)':'var(--green)';
                return `<tr class="clickable" data-device-row="${esc(d.device_id)}">
                  <td onclick="event.stopPropagation()"><input type="checkbox" class="checkbox device-check" data-id="${esc(d.device_id)}" ${state.selectedDeviceIds.has(d.device_id)?'checked':''}></td>
                  <td data-open-device="${esc(d.device_id)}"><div class="cell-primary">${esc(deviceLabel(d))}</div><div class="cell-sub mono">${esc(d.device_id)}</div></td>
                  <td data-open-device="${esc(d.device_id)}"><span class="badge ${statusMeta(s).badge}">${signalIcon(s)} ${statusMeta(s).label}</span></td>
                  <td data-open-device="${esc(d.device_id)}">${d.group_name ? `<span class="badge b-gray">${icon('groups',11)} ${esc(d.group_name)}</span>` : '<span class="text-faint">Uncategorized</span>'}</td>
                  <td class="num" data-open-device="${esc(d.device_id)}"><div class="meter-row" style="justify-content:flex-end;"><span class="mono">${d.battery!=null?d.battery+'%':'—'}</span><div class="meter"><i style="width:${d.battery??0}%; background:${battColor}"></i></div></div></td>
                  <td class="num mono" data-open-device="${esc(d.device_id)}">${fmtBytes(d.storage_free)}</td>
                  <td class="mono text-dim" data-open-device="${esc(d.device_id)}">${esc(d.app_version||'—')}</td>
                  <td class="text-dim" data-open-device="${esc(d.device_id)}">${fmtRelTime(d.last_seen)}</td>
                  <td onclick="event.stopPropagation()"><button class="btn btn-sm btn-ghost" data-open-device="${esc(d.device_id)}">Manage</button></td>
                </tr>`;
              }).join('') || `<tr><td colspan="9"><div class="empty-state">${icon('devices',30)}<div class="t">No devices match</div><div class="d">Try clearing filters or search, or wait for a device to check in.</div></div></td></tr>`}
            </tbody>
          </table>
        </div>
      </div>
    `;
  }
  function sortArrow(key){
    if (state.deviceSort.key !== key) return '';
    return state.deviceSort.dir === 'asc' ? '▲' : '▼';
  }

  const BULK_COMMANDS = [
    { type:'REFRESH_CONTENT', label:'Refresh content' },
    { type:'SHOW_MESSAGE', label:'Show message', field:{name:'text', placeholder:'Message to display'} },
    { type:'SET_VOLUME', label:'Set volume', field:{name:'level', placeholder:'0–100', type:'number'} },
    { type:'SET_BRIGHTNESS', label:'Set brightness', field:{name:'level', placeholder:'0–100', type:'number'} },
    { type:'LOCK_DEVICE', label:'Lock' },
    { type:'RELEASE_LOCK', label:'Release lock' },
    { type:'REBOOT', label:'Reboot (Device Owner only)' },
    { type:'CLEAR_AD', label:'Clear pushed ad' },
  ];
  function renderBulkCommandArea(){
    const area = document.getElementById('bulkCommandArea');
    if (!area) return;
    area.innerHTML = `
      <div class="inline-form">
        <select id="bulkType">${BULK_COMMANDS.map(c=>`<option value="${c.type}">${c.label}</option>`).join('')}</select>
        <span id="bulkFieldWrap" style="flex:1"></span>
        <button class="btn btn-primary btn-sm" id="bulkSend">${icon('send',13)} Send</button>
      </div>`;
    const typeSel = document.getElementById('bulkType');
    const fieldWrap = document.getElementById('bulkFieldWrap');
    function paintField(){
      const cmd = BULK_COMMANDS.find(c=>c.type===typeSel.value);
      fieldWrap.innerHTML = cmd.field ? `<input id="bulkField" type="${cmd.field.type||'text'}" placeholder="${cmd.field.placeholder}" style="width:100%; background:var(--surface-3); border:1px solid var(--border-strong); color:var(--text); border-radius:6px; padding:8px 10px; font-size:13px;">` : '';
    }
    typeSel.addEventListener('change', paintField);
    paintField();
    document.getElementById('bulkSend').addEventListener('click', async ()=>{
      const cmd = BULK_COMMANDS.find(c=>c.type===typeSel.value);
      let payload = null;
      if (cmd.field){
        const val = document.getElementById('bulkField').value.trim();
        if (!val){ toast('Fill in the value first', 'err'); return; }
        payload = { [cmd.field.name]: cmd.field.type==='number' ? Number(val) : val };
      }
      try{
        const res = await api('/api/devices/bulk-commands', { method:'POST', json:{ device_ids:[...state.selectedDeviceIds], command_type:cmd.type, payload } });
        toast(`Sent "${cmd.label}" to ${res.sent_to} device(s)`, 'ok');
        state.selectedDeviceIds.clear();
        renderView();
      }catch(err){ toast(err.message, 'err'); }
    });
  }

  function wireDevicesEvents(){
    const fs = document.getElementById('filterStatus'), fg = document.getElementById('filterGroup');
    if (fs) fs.addEventListener('change', ()=>{ deviceFilterStatus = fs.value; renderView(); });
    if (fg) fg.addEventListener('change', ()=>{ deviceFilterGroup = fg.value; renderView(); });
    document.querySelectorAll('[data-sort]').forEach(th=>{
      th.style.cursor = 'pointer';
      th.addEventListener('click', ()=>{
        const key = th.dataset.sort;
        if (state.deviceSort.key === key) state.deviceSort.dir = state.deviceSort.dir==='asc'?'desc':'asc';
        else state.deviceSort = { key, dir:'asc' };
        renderView();
      });
    });
    document.querySelectorAll('.device-check').forEach(cb=>{
      cb.addEventListener('change', ()=>{
        if (cb.checked) state.selectedDeviceIds.add(cb.dataset.id); else state.selectedDeviceIds.delete(cb.dataset.id);
        renderView();
      });
    });
    const selAll = document.getElementById('selectAllDevices');
    if (selAll) selAll.addEventListener('change', ()=>{
      if (selAll.checked) filteredDevices().forEach(d=>state.selectedDeviceIds.add(d.device_id));
      else filteredDevices().forEach(d=>state.selectedDeviceIds.delete(d.device_id));
      renderView();
    });
    const clearSel = document.getElementById('clearSelection');
    if (clearSel) clearSel.addEventListener('click', ()=>{ state.selectedDeviceIds.clear(); renderView(); });
    renderBulkCommandArea();
  }

  function wireSectionEvents(){
    const wirers = { devices:wireDevicesEvents, groups:wireGroupsEvents, content:wireContentEvents, layouts:wireLayoutsEvents, apps:wireAppsEvents, alerts:wireAlertsEvents };
    if (wirers[state.section]) wirers[state.section]();
  }

  /* ============================= GROUPS ============================= */
  function renderGroups(){
    return `
      <div class="view-head">
        <div><h1 style="font-size:20px;">Groups</h1><div class="lede">Organize devices so you can push content and commands to a whole set at once.</div></div>
        <div class="view-actions"><button class="btn btn-primary" id="newGroupBtn">${icon('plus')} New group</button></div>
      </div>
      <div class="media-grid" style="grid-template-columns:repeat(auto-fill,minmax(240px,1fr));">
        ${state.groups.map(g=>`
          <div class="card">
            <div class="card-body">
              <div class="flex" style="justify-content:space-between; margin-bottom:10px;">
                <span class="avatar-square">${icon('groups',16)}</span>
                <button class="btn btn-icon btn-ghost" data-del-group="${g.id}" title="Delete group">${icon('trash',14)}</button>
              </div>
              <div class="cell-primary" style="font-size:14.5px; margin-bottom:2px;">${esc(g.name)}</div>
              <div class="text-faint" style="font-size:11.5px; margin-bottom:14px;">${g.device_count} device${g.device_count===1?'':'s'} · created ${fmtDate(g.created_at)}</div>
              <div class="flex gap8">
                <button class="btn btn-sm grow" data-view-group="${g.id}">View devices</button>
                <button class="btn btn-sm btn-primary" data-command-group="${g.id}">Send command</button>
              </div>
            </div>
          </div>`).join('') || `<div class="card"><div class="empty-state">${icon('groups',30)}<div class="t">No groups yet</div><div class="d">Create a group to organize devices by location, room, or role.</div></div></div>`}
      </div>
    `;
  }
  function wireGroupsEvents(){
    document.getElementById('newGroupBtn')?.addEventListener('click', ()=>{
      openModal(`
        <div class="modal-head"><h3>New group</h3><button class="btn btn-icon btn-ghost" data-close-modal>${icon('x',15)}</button></div>
        <div class="modal-body">
          <div class="field"><label>Group name</label><input id="groupName" placeholder="e.g. Lobby Screens" autofocus></div>
        </div>
        <div class="modal-foot"><button class="btn" data-close-modal>Cancel</button><button class="btn btn-primary" id="createGroupBtn">${icon('plus',14)} Create group</button></div>
      `);
      wireModalClose();
      document.getElementById('createGroupBtn').addEventListener('click', async ()=>{
        const name = document.getElementById('groupName').value.trim();
        if (!name){ toast('Group name is required', 'err'); return; }
        try{ await api('/api/groups', { method:'POST', json:{ name } }); toast('Group created', 'ok'); closeModal(); await loadAll(false); }
        catch(err){ toast(err.message, 'err'); }
      });
    });
    document.querySelectorAll('[data-del-group]').forEach(btn=>btn.addEventListener('click', async ()=>{
      const g = state.groups.find(x=>String(x.id)===btn.dataset.delGroup);
      const ok = await confirmAction(`Delete "${g.name}"? Its ${g.device_count} device(s) will move to Uncategorized.`);
      if (!ok) return;
      try{ await api('/api/groups/'+btn.dataset.delGroup, { method:'DELETE' }); toast('Group deleted', 'ok'); await loadAll(false); }
      catch(err){ toast(err.message, 'err'); }
    }));
    document.querySelectorAll('[data-view-group]').forEach(btn=>btn.addEventListener('click', ()=>{
      deviceFilterGroup = btn.dataset.viewGroup; navigate('devices');
    }));
    document.querySelectorAll('[data-command-group]').forEach(btn=>btn.addEventListener('click', ()=>{
      const g = state.groups.find(x=>String(x.id)===btn.dataset.commandGroup);

      deviceFilterGroup = String(g.id);

  /* ============================= CONTENT LIBRARY (ADS) ============================= */
  const MEDIA_META = {
    image:{icon:'image', badge:'b-blue'}, video:{icon:'video', badge:'b-violet'},
    web:{icon:'web', badge:'b-teal'}, text:{icon:'text', badge:'b-amber'},
  };
  function renderContent(){
    return `
      <div class="view-head">
        <div><h1 style="font-size:20px;">Content library</h1><div class="lede">Images, videos, web pages and text snippets you can arrange into layouts or push instantly to any screen.</div></div>
        <div class="view-actions"><button class="btn btn-primary" id="newAdBtn">${icon('plus')} Add content</button></div>
      </div>
      <div class="media-grid">
        ${state.ads.map(ad=>{
          const m = MEDIA_META[ad.media_type];
          let thumb = `<span style="color:var(--text-faint)">${icon(m.icon,26)}</span>`;
          if (ad.media_type === 'image') thumb = `<img src="${esc(ad.url)}" loading="lazy" alt="">`;
          else if (ad.media_type === 'video') thumb = `<video src="${esc(ad.url)}" muted preload="metadata"></video>`;
          return `<div class="media-card">
            <div class="media-thumb">${thumb}<span class="type-chip badge ${m.badge}">${icon(m.icon,11)} ${ad.media_type}</span></div>
            <div class="media-body">
              <div class="media-title" title="${esc(ad.name)}">${esc(ad.name)}</div>
              <div class="media-meta"><span>${ad.duration_seconds}s${ad.size?' · '+fmtBytes(ad.size):''}</span><span>${fmtDate(ad.created_at).split(',')[0]}</span></div>
              <div class="media-actions">
                ${ad.source==='url' && ad.media_type!=='text' ? `<a class="btn btn-sm grow" href="${esc(ad.url)}" target="_blank" rel="noopener">${icon('link',12)} Open</a>` : `<button class="btn btn-sm grow" data-push-ad="${ad.id}">${icon('ad',12)} Push live</button>`}
                <button class="btn btn-sm btn-icon btn-danger" data-del-ad="${ad.id}" title="Delete">${icon('trash',13)}</button>
              </div>
            </div>
          </div>`;
        }).join('') || `<div class="card"><div class="empty-state">${icon('content',30)}<div class="t">Your library is empty</div><div class="d">Add images, videos, a web page, or a text card to start building layouts.</div></div></div>`}
      </div>
    `;
  }
  function wireContentEvents(){
    document.getElementById('newAdBtn')?.addEventListener('click', openAddContentModal);
    document.querySelectorAll('[data-del-ad]').forEach(btn=>btn.addEventListener('click', async ()=>{
      const ok = await confirmAction('Delete this content item? It will be removed from any layouts using it.');
      if (!ok) return;
      try{ await api('/api/ads/'+btn.dataset.delAd, { method:'DELETE' }); toast('Content deleted', 'ok'); await loadAll(false); }
      catch(err){ toast(err.message, 'err'); }
    }));
    document.querySelectorAll('[data-push-ad]').forEach(btn=>btn.addEventListener('click', ()=>openPushAdModal(btn.dataset.pushAd)));
  }
  function openAddContentModal(){
    openModal(`
      <div class="modal-head"><h3>Add content</h3><button class="btn btn-icon btn-ghost" data-close-modal>${icon('x',15)}</button></div>
      <div class="modal-body">
        <div class="radio-tabs" style="margin-bottom:16px;" id="adTypeTabs">
          <button class="active" data-type="image">Image</button>
          <button data-type="video">Video</button>
          <button data-type="web">Web page</button>
          <button data-type="text">Text</button>
        </div>
        <div class="field"><label>Name</label><input id="adName" placeholder="e.g. Summer Promo"></div>
        <div id="adTypeBody"></div>
        <div class="field" id="adDurationWrap"><label>Duration (seconds)</label><input id="adDuration" type="number" min="1" placeholder="10"></div>
      </div>
      <div class="modal-foot"><button class="btn" data-close-modal>Cancel</button><button class="btn btn-primary" id="saveAdBtn">${icon('upload',14)} Add to library</button></div>
    `, {wide:false});
    wireModalClose();
    let currentType = 'image';
    const body = document.getElementById('adTypeBody');
    function paintBody(){
      if (currentType === 'image' || currentType === 'video'){
        body.innerHTML = `
          <div class="radio-tabs" style="margin-bottom:12px;">
            <button class="active" data-src="upload">Upload file</button>
            <button data-src="url">From URL</button>
          </div>
          <div id="adSrcBody">
            <div class="dropzone" id="adDropzone">${icon('upload',22)}<div style="margin-top:8px;">Click to choose ${currentType==='image'?'an image':'a video'} or drag it here</div><input type="file" id="adFile" accept="${currentType==='image'?'image/*':'video/*'}" style="display:none">
            <div id="adFileName" class="text-dim" style="margin-top:8px; font-size:12px;"></div></div>
          </div>`;
        wireSrcTabs();
      } else if (currentType === 'web'){
        body.innerHTML = `<div class="field"><label>Web page URL</label><input id="adUrl" placeholder="https://example.com/menu-board"></div>`;
      } else {
        body.innerHTML = `<div class="field"><label>Text content</label><textarea id="adText" rows="4" placeholder="Announcement text to display full-screen"></textarea></div>`;
      }
      document.getElementById('adDurationWrap').style.display = currentType==='web' ? 'none' : 'block';
    }
    function wireSrcTabs(){
      let srcMode = 'upload';
      const tabs = body.querySelectorAll('[data-src]');
      const srcBody = document.getElementById('adSrcBody');
      tabs.forEach(t=>t.addEventListener('click', ()=>{
        tabs.forEach(x=>x.classList.remove('active')); t.classList.add('active'); srcMode = t.dataset.src;
        if (srcMode === 'upload'){
          srcBody.innerHTML = `<div class="dropzone" id="adDropzone">${icon('upload',22)}<div style="margin-top:8px;">Click to choose ${currentType==='image'?'an image':'a video'} or drag it here</div><input type="file" id="adFile" accept="${currentType==='image'?'image/*':'video/*'}" style="display:none"><div id="adFileName" class="text-dim" style="margin-top:8px; font-size:12px;"></div></div>`;
          wireDropzone();
        } else {
          srcBody.innerHTML = `<div class="field"><label>Media URL</label><input id="adUrl" placeholder="https://example.com/video.mp4"></div>`;
        }
      }));
      wireDropzone();
    }
    function wireDropzone(){
      const dz = document.getElementById('adDropzone'); if (!dz) return;
      const input = document.getElementById('adFile');
      dz.addEventListener('click', ()=>input.click());
      input.addEventListener('change', ()=>{ document.getElementById('adFileName').textContent = input.files[0] ? input.files[0].name + ' · ' + fmtBytes(input.files[0].size) : ''; });
      ['dragover','dragleave','drop'].forEach(evt=>dz.addEventListener(evt, e=>{ e.preventDefault(); dz.classList.toggle('drag', evt==='dragover'); }));
      dz.addEventListener('drop', e=>{ input.files = e.dataTransfer.files; document.getElementById('adFileName').textContent = input.files[0] ? input.files[0].name : ''; });
    }
    document.getElementById('adTypeTabs').querySelectorAll('[data-type]').forEach(t=>t.addEventListener('click', ()=>{
      document.querySelectorAll('#adTypeTabs [data-type]').forEach(x=>x.classList.remove('active')); t.classList.add('active');
      currentType = t.dataset.type; paintBody();
    }));
    paintBody();

    document.getElementById('saveAdBtn').addEventListener('click', async ()=>{
      const name = document.getElementById('adName').value.trim();
      const duration = document.getElementById('adDuration')?.value;
      if (!name){ toast('Name is required', 'err'); return; }
      try{
        let res;
        if (currentType === 'web' || currentType === 'text'){
          const val = currentType==='web' ? document.getElementById('adUrl').value.trim() : document.getElementById('adText').value.trim();
          if (!val){ toast(currentType==='web'?'URL is required':'Text is required', 'err'); return; }
          res = await api('/api/ads', { method:'POST', json:{ name, media_type:currentType, external_url:val, duration_seconds: duration?Number(duration):undefined } });
        } else {
          const urlField = document.getElementById('adUrl');
          if (urlField){
            const val = urlField.value.trim();
            if (!val){ toast('URL is required', 'err'); return; }
            res = await api('/api/ads', { method:'POST', json:{ name, media_type:currentType, external_url:val, duration_seconds: duration?Number(duration):undefined } });
          } else {
            const file = document.getElementById('adFile').files[0];
            if (!file){ toast('Choose a file first', 'err'); return; }
            const form = new FormData();
            form.append('file', file); form.append('name', name); form.append('media_type', currentType);
            if (duration) form.append('duration_seconds', duration);
            res = await api('/api/ads', { method:'POST', body:form });
          }
        }
        toast('Content added', 'ok'); closeModal(); await loadAll(false);
      }catch(err){ toast(err.message, 'err'); }
    });
  }
  function openPushAdModal(adId){
    const ad = state.ads.find(a=>String(a.id)===String(adId));
    openModal(`
      <div class="modal-head"><h3>Push "${esc(ad.name)}" live</h3><button class="btn btn-icon btn-ghost" data-close-modal>${icon('x',15)}</button></div>
      <div class="modal-body">
        <p class="text-dim" style="font-size:12.5px; line-height:1.6; margin-top:0;">Shows this as a full-screen overlay instantly, on top of whatever's currently playing. Use "Clear pushed ad" from a device's Remote Control tab to remove it.</p>
        <div class="field"><label>Target</label>
          <select id="pushTarget">
            <option value="">Select a device…</option>
            ${state.devices.map(d=>`<option value="${esc(d.device_id)}">${esc(deviceLabel(d))}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="modal-foot"><button class="btn" data-close-modal>Cancel</button><button class="btn btn-primary" id="pushAdSend">${icon('send',14)} Push now</button></div>

    wireModalClose();
    document.getElementById('pushAdSend').addEventListener('click', async ()=>{
      const target = document.getElementById('pushTarget').value;
      if (!target){ toast('Choose a device', 'err'); return; }
      try{
        await api(`/api/devices/${encodeURIComponent(target)}/commands`, { method:'POST', json:{ command_type:'PUSH_AD', payload:{ media_type:ad.media_type, url:ad.url } } });
        toast('Ad pushed', 'ok'); closeModal();
